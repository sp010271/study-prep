  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f4f7fb 0%, #e9f0f8 50%, #f7f9fc 100%);
      --glass-bg: rgba(255, 255, 255, 0.82);
      --glass-border: rgba(255, 255, 255, 0.96);
      --glass-shadow: 0 12px 36px rgba(15, 23, 42, 0.06);
      --text-main: #0f172a;
      --text-sub: #475569;
      --primary: #0f766e;
      --accent: #2563eb;
      --danger: #dc2626;
      --warning: #d97706;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.65;
    }

    .liquid-card {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(165%);
      -webkit-backdrop-filter: blur(22px) saturate(165%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 24px;
    }

    .week-strip::-webkit-scrollbar {
      display: none;
    }

    .week-strip {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid rgba(203, 213, 225, 0.85);
      background: rgba(255, 255, 255, 0.94);
      color: var(--text-main);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #93c5fd;
      background: #f8fafc;
    }

    .option-btn.selected {
      border-color: var(--accent);
      background: rgba(37, 99, 235, 0.1);
      color: #1e3a8a;
    }

    .option-btn.correct {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      color: #065f46;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: rgba(220, 38, 38, 0.1);
      color: #991b1b;
    }

    @keyframes pulseUrgent {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .timer-urgent {
      animation: pulseUrgent 1s infinite;
    }
  </style>
</head>

<script>
  const STORAGE_KEY = "private_school_sprint_v5_library";

  // Toast Banner
  function showToast(msg, icon = "\u2728") {
    const banner = document.getElementById("toast-banner");
    document.getElementById("toast-msg").textContent = msg;
    document.getElementById("toast-icon").textContent = icon;
    banner.classList.remove("opacity-0", "-translate-y-3");
    banner.classList.add("opacity-100", "translate-y-0");
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => {
      banner.classList.add("opacity-0", "-translate-y-3");
      banner.classList.remove("opacity-100", "translate-y-0");
    }, 2800);
  }

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) state = Object.assign(state, JSON.parse(saved));
    } catch (e) {}
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
    updatePortalSummary();
  }

  function getWeekReadState(w) {
    if (!state.readProgress[w]) {
      state.readProgress[w] = { chi: false, math: false, eng: false, warmupAns: {} };
    }
    return state.readProgress[w];
  }

    document.getElementById("portal-week-label").textContent = `\u7B2C ${state.currentWeek} \u9031`;
    document.getElementById("portal-progress-label").textContent = `${state.completedWeeks.length} / 15 \u9031`;
    document.getElementById("portal-wrong-label").textContent = `${state.wrongBook.length} \u984C`;
  }

  function enterStudyStation() {
    document.getElementById("portal-view").classList.add("hidden");
    document.getElementById("app-view").classList.remove("hidden");
    renderAll();
    switchStep(state.currentStep || 1);
  }

  function returnToPortal() {
    stopTimer();
    stopStudyTimer();
    updatePortalSummary();
    document.getElementById("app-view").classList.add("hidden");
    document.getElementById("portal-view").classList.remove("hidden");
  }

  function startStudyTimer() {
    stopStudyTimer();
    studyInterval = setInterval(() => {
      studySec++;
      const m = String(Math.floor(studySec / 60)).padStart(2, "0");
      const s = String(studySec % 60).padStart(2, "0");
      const el = document.getElementById("study-timer-badge");
      if (el) el.textContent = `\u23F1\uFE0F \u7CBE\u8B80\u8A08\u6642 ${m}:${s}`;
    }, 1000);
  }

  function stopStudyTimer() {
    clearInterval(studyInterval);
  }

  function calcDaysToExam() {
    const examDate = new Date("2027-02-27T08:00:00+08:00");
    const diff = Math.ceil((examDate - new Date()) / (1000 * 60 * 60 * 24));
    return diff > 0 ? diff : 0;
  }

  function renderAll() {
    document.getElementById("countdown-days").textContent = `${calcDaysToExam()} \u5929`;
    document.getElementById("completed-count").textContent = `${state.completedWeeks.length} / 15`;
    document.getElementById("solved-unique-count").textContent = `${state.solvedIds.length} \u984C`;

    // Render Week Strip
    const strip = document.getElementById("week-strip");
    strip.innerHTML = "";
    for (let w = 1; w <= 15; w++) {
      const btn = document.createElement("button");
      const isDone = state.completedWeeks.includes(w);
      const isActive = w === state.currentWeek;
      btn.className = `flex-none px-4 py-2.5 rounded-2xl border text-xs font-extrabold flex flex-col items-center min-w-[82px] transition cursor-pointer ${
        isActive
          ? "bg-teal-700 text-white border-teal-700 shadow-md"
          : isDone

            : "bg-white/75 text-slate-600 border-slate-200 hover:bg-white"

      btn.innerHTML = `<span>W${w}</span><span class="text-[11px] mt-0.5 opacity-90">${isDone ? "\u2705 \u5DF2\u904E\u95DC" : "\u885D\u523A\u4E2D"}</span>`;
      btn.onclick = () => selectWeek(w);
      strip.appendChild(btn);

    document.getElementById("week-date-range").textContent = lib.range;
    document.getElementById("current-week-badge").textContent = `\u7B2C ${lib.w} \u9031\u9032\u5EA6`;

    statusEl.textContent = passed ? "\u2705 \u672C\u9031\u5DF2\u9054\u6A19" : "\u23F3 \u5C1A\u672A\u901A\u95DC";
    statusEl.className = passed ? "text-xs sm:text-sm font-extrabold text-emerald-600" : "text-xs sm:text-sm font-extrabold text-slate-500";

  function selectWeek(w) {
    state.currentWeek = w;
    state.currentStep = 1;
    studySec = 0;
    saveState();
    buildQuizSet();
    renderAll();
    switchStep(1);
  }

  function switchStep(step) {
    state.currentStep = step;
    saveState();
    [1, 2, 3].forEach(i => {
      const tab = document.getElementById(`tab-${i}`);
      const panel = document.getElementById(`step-${i}-panel`);
      if (i === step) {
        tab.className = "p-3.5 rounded-2xl border-2 border-teal-700 bg-white text-xs sm:text-sm font-black text-teal-800 shadow-sm transition cursor-pointer";
        panel.classList.remove("hidden");

        tab.className = "p-3.5 rounded-2xl border border-slate-300/70 bg-white/75 text-xs sm:text-sm font-extrabold text-slate-500 hover:bg-white transition cursor-pointer";
        panel.classList.add("hidden");
      }
    });

    if (step === 1) {
      startStudyTimer();
      renderTeachingLibrary();
    } else {
      stopStudyTimer();
    }

    if (step === 2) {
      if (!quizSubmitted && !timerRunning) startTimer();
    } else {
      stopTimer();
    }

    if (step === 3) renderWrongBook();
  }

  function renderWarmupBox(sub, warmup, rState) {
    const userAns = rState.warmupAns[sub];

      let cls = "option-btn text-xs sm:text-sm py-2.5 px-3.5";

        else if (userAns === idx) cls += " wrong";
      }
      return `<button class="${cls}" onclick="answerWarmup('${sub}', ${idx})">${String.fromCharCode(65 + idx)}. ${opt}</button>`;
    }).join("");

    return `
      <div class="pt-4 border-t border-slate-200/80 space-y-3">

        ${userAns !== undefined ? `<div class="p-3 rounded-xl bg-emerald-50/80 border border-emerald-200 text-xs text-emerald-950 font-semibold">\u89E3\u6790\uFF1A${warmup.exp}</div>` : ""}
        <div class="flex items-center justify-between pt-2">
          <label class="inline-flex items-center gap-2 cursor-pointer text-xs sm:text-sm font-extrabold text-teal-800">
            <input type="checkbox" ${isChecked ? "checked" : ""} onchange="toggleSubjectRead('${sub}')" class="w-4 h-4 accent-teal-700 rounded cursor-pointer" />
            <span>\u6211\u5DF2\u7CBE\u8B80\u5B8C\u7562\u6B64\u79D1\u8B1B\u7FA9</span>
          </label>

        </div>
      </div>
    `;
  }

  // =========================================================================
  // STEP 2: CURRICULUM-ALIGNED & DERIVATIVE QUIZ ENGINE
  // =========================================================================
  function shuffleArray(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function pickAlignedQuestions(sub, weekNum, count) {
    const pool = ALIGNED_STATIC_BANK.filter(q => q.sub === sub);
    const weekMatched = pool.filter(q => q.weeks && q.weeks.includes(weekNum));
    const others = pool.filter(q => !q.weeks || !q.weeks.includes(weekNum));

    const prioritizeUnseen = (list) => {
      const unseen = list.filter(q => !state.solvedIds.includes(q.id));
      const seen = list.filter(q => state.solvedIds.includes(q.id));
      return [...shuffleArray(unseen), ...shuffleArray(seen)];
    };

    const combined = [...prioritizeUnseen(weekMatched), ...prioritizeUnseen(others)];
    return combined.slice(0, count).map(q => {
      const correctText = q.opts[q.ans];
      const shuffledOpts = shuffleArray(q.opts);
      return Object.assign({}, q, {
        opts: shuffledOpts,
        ans: shuffledOpts.indexOf(correctText)
      });
    });
  }

  function buildQuizSet() {
    const lib = getWeekLibrary(state.currentWeek);
    const chiQs = pickAlignedQuestions("\u570B\u6587", state.currentWeek, 2);
    const engQs = pickAlignedQuestions("\u82F1\u6587", state.currentWeek, 2);
    const mathQs = generateAlignedMath(lib.topicKey).map(q => {
      const correctText = q.opts[q.ans];
      const shuffledOpts = shuffleArray(q.opts);
      return Object.assign({}, q, {
        opts: shuffledOpts,
        ans: shuffledOpts.indexOf(correctText)
      });
    });

    activeQuestions = [...chiQs, ...mathQs, ...engQs];
    userAnswers = {};
    quizSubmitted = false;
    document.getElementById("quiz-submit-area").classList.remove("hidden");
    document.getElementById("quiz-result-banner").classList.add("hidden");
    renderQuizQuestions();
  }

  function refreshNewQuestions() {
    buildQuizSet();
    resetTimer();
    startTimer();
    showToast("\u5DF2\u6839\u64DA\u672C\u9031\u6559\u5B78\u5EAB\u751F\u6210\u5168\u65B0\u884D\u751F\u8B8A\u5316\u984C\uFF01", "\uD83D\uDD04");
  }

  function renderQuizQuestions() {
    const container = document.getElementById("quiz-questions-container");
    container.innerHTML = "";
    activeQuestions.forEach((q, idx) => {
      const card = document.createElement("div");
      card.className = "liquid-card p-5 sm:p-6";

      const optsHtml = q.opts.map((opt, oIdx) => {
        let cls = "option-btn";
        if (quizSubmitted) {
          if (oIdx === q.ans) cls += " correct";
          else if (userAnswers[idx] === oIdx) cls += " wrong";
        } else if (userAnswers[idx] === oIdx) {
          cls += " selected";
        }
        return `<button class="${cls}" ${quizSubmitted ? "disabled" : ""} onclick="selectOption(${idx}, ${oIdx})">${String.fromCharCode(65 + oIdx)}. ${opt}</button>`;
      }).join("");

      card.innerHTML = `
        <div class="flex justify-between items-center gap-2 mb-3">
          <div>
            <span class="inline-block px-3 py-1 rounded-full text-xs font-extrabold bg-teal-50 text-teal-800">${q.sub} &middot; ${q.type}</span>
            <strong class="ml-2 text-sm sm:text-base text-slate-900">\u7B2C ${idx + 1} \u984C</strong>
          </div>
          <button class="px-3 py-1.5 rounded-xl border border-amber-200 bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-bold cursor-pointer" onclick="showHint(${idx})">&#x1F4A1; \u63D0\u793A</button>
        </div>
        <div class="text-base font-bold text-slate-900 whitespace-pre-line mb-4">${q.stem}</div>
        <div class="flex flex-col gap-2.5">${optsHtml}</div>
        <div class="mt-3 p-3.5 rounded-xl bg-amber-50/90 border border-amber-200 text-amber-950 text-xs sm:text-sm hidden" id="hint-${idx}" data-level="0"></div>
        ${quizSubmitted ? `<div class="mt-4 p-4 rounded-xl bg-slate-50 border-l-4 border-teal-700 text-xs sm:text-sm text-slate-700"><strong>\u89E3\u6790\uFF1A</strong>${q.exp}</div>` : ""}
      `;
      container.appendChild(card);
    });
  }

  function selectOption(qIdx, oIdx) {
    if (quizSubmitted) return;
    userAnswers[qIdx] = oIdx;
    renderQuizQuestions();
  }

  function showHint(idx) {
    const box = document.getElementById(`hint-${idx}`);
    const q = activeQuestions[idx];
    const lvl = parseInt(box.getAttribute("data-level") || "0", 10);
    box.classList.remove("hidden");
    if (lvl === 0) {
      box.innerHTML = `<strong>\u63D0\u793A 1\uFF08\u601D\u8DEF\u5F15\u5C0E\uFF09\uFF1A</strong>${q.h1}`;
      box.setAttribute("data-level", "1");
    } else {
      box.innerHTML = `<strong>\u63D0\u793A 1\uFF1A</strong>${q.h1}<br><strong>\u63D0\u793A 2\uFF08\u95DC\u9375\u6B65\u9A5F\uFF09\uFF1A</strong>${q.h2}`;
      box.setAttribute("data-level", "2");
    }
  }

  function submitQuiz() {
    if (Object.keys(userAnswers).length < activeQuestions.length) {
      showToast("\u9084\u6709\u984C\u76EE\u5C1A\u672A\u4F5C\u7B54\u5594\uFF01\u8ACB\u5148\u5B8C\u6210\u6240\u6709\u984C\u76EE\u518D\u4EA4\u5377\u3002", "\u26A0\uFE0F");
      return;
    }
    stopTimer();
    quizSubmitted = true;

    let correctCount = 0;
    activeQuestions.forEach((q, idx) => {
      if (!state.solvedIds.includes(q.id)) state.solvedIds.push(q.id);
      if (userAnswers[idx] === q.ans) {
        correctCount++;
      } else {
        if (!state.wrongBook.some(w => w.id === q.id)) {
          state.wrongBook.unshift(q);
        }
      }
    });

    const score = Math.round((correctCount / activeQuestions.length) * 100);
    if (score >= 80 && !state.completedWeeks.includes(state.currentWeek)) {
      state.completedWeeks.push(state.currentWeek);
      if (state.currentWeek < 15) state.currentWeek += 1;
    }

    saveState();
    renderAll();
    renderQuizQuestions();

    document.getElementById("quiz-submit-area").classList.add("hidden");
    const banner = document.getElementById("quiz-result-banner");
    banner.classList.remove("hidden");
    document.getElementById("result-score-text").textContent = `\u672C\u6B21\u5F97\u5206\uFF1A${score} \u5206\uFF08\u7B54\u5C0D ${correctCount} / ${activeQuestions.length} \u984C\uFF09`;
    document.getElementById("result-feedback-text").textContent = score >= 80
      ? "\u592A\u68D2\u4E86\uFF01\u9054\u6210 80 \u5206\u901A\u95DC\u6A19\u6E96\uFF0C\u5DF2\u81EA\u52D5\u89E3\u9396\u4E26\u63A8\u9032\u9032\u5EA6\u3002"
      : "\u5C1A\u672A\u9054 80 \u5206\u901A\u95DC\u9580\u6ABB\uFF0C\u5EFA\u8B70\u5148\u5230\u300C\u6B65\u9A5F\u4E09\uFF1A\u932F\u984C\u8907\u7FD2\u300D\u641E\u61C2\u89E3\u6790\u4E26\u7DF4\u7FD2\u884D\u751F\u984C\uFF01";
    banner.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  // =========================================================================
  // STEP 3: WRONG BOOK & SIMILAR DERIVATIVE PRACTICE
  // =========================================================================
  function renderWrongBook() {
    const box = document.getElementById("wrong-book-container");
    if (state.wrongBook.length === 0) {
      box.innerHTML = `<div class="liquid-card p-10 text-center text-slate-500">
        <div class="text-4xl mb-3">&#x1F389;</div>
        <div class="font-extrabold text-base text-slate-800">\u76EE\u524D\u6C92\u6709\u5F85\u8907\u7FD2\u7684\u932F\u984C\uFF01</div>
        <div class="text-xs sm:text-sm mt-1">\u7E7C\u7E8C\u4FDD\u6301\uFF0C\u524D\u5F80\u6B65\u9A5F\u4E8C\u6311\u6230\u66F4\u591A\u65B0\u984C\u5427\u3002</div>
      </div>`;
      return;
    }

    box.innerHTML = state.wrongBook.map((q, idx) => {
      const sim = q.similar;
      const simHtml = sim ? `
        <div class="mt-4 pt-4 border-t border-dashed border-slate-200 space-y-2.5">
          <div class="text-xs sm:text-sm font-black text-blue-800">${sim.stem}</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            ${sim.opts.map((opt, oIdx) => `<button class="option-btn text-xs sm:text-sm py-2 px-3" id="sim-btn-${idx}-${oIdx}" onclick="checkSimilar(${idx}, ${oIdx})">${String.fromCharCode(65 + oIdx)}. ${opt}</button>`).join("")}
          </div>
          <div id="sim-exp-${idx}" class="hidden p-3 rounded-xl bg-blue-50 text-xs text-blue-950 font-semibold">\u89E3\u6790\uFF1A${sim.exp}</div>
        </div>
      ` : "";

      return `
        <div class="liquid-card p-5 sm:p-6">
          <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
            <span class="inline-block px-3 py-1 rounded-full text-xs font-extrabold bg-rose-50 text-rose-700">${q.sub} &middot; ${q.type}</span>
            <button class="px-3.5 py-1.5 rounded-xl border border-emerald-500 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold cursor-pointer" onclick="markMastered(${idx})">&#x2705; \u6211\u5DF2\u5B8C\u5168\u641E\u61C2\uFF08\u79FB\u9664\uFF09</button>
          </div>
          <div class="text-base font-bold text-slate-900 whitespace-pre-line mb-3">${q.stem}</div>
          <div class="font-extrabold text-sm text-emerald-700 mb-2">\u6B63\u78BA\u7B54\u6848\uFF1A${q.opts[q.ans]}</div>
          <div class="p-4 rounded-xl bg-slate-50 border-l-4 border-teal-700 text-xs sm:text-sm text-slate-700"><strong>\u767D\u8A71\u89E3\u6790\uFF1A</strong>${q.exp}</div>
          ${simHtml}
        </div>
      `;
    }).join("");
  }

  function checkSimilar(wIdx, oIdx) {
    const q = state.wrongBook[wIdx];
    if (!q || !q.similar) return;
    q.similar.opts.forEach((_, i) => {
      const b = document.getElementById(`sim-btn-${wIdx}-${i}`);
      if (!b) return;
      b.classList.remove("correct", "wrong");
      if (i === q.similar.ans) b.classList.add("correct");
      else if (i === oIdx) b.classList.add("wrong");
    });
    const expEl = document.getElementById(`sim-exp-${wIdx}`);
    if (expEl) expEl.classList.remove("hidden");
  }

  function markMastered(idx) {
    state.wrongBook.splice(idx, 1);
    saveState();
    renderAll();
    showToast("\u5DF2\u5F9E\u932F\u984C\u672C\u79FB\u9664\u6B64\u984C\uFF01", "\u2705");
  }

  // =========================================================================
  // EXAM TIMER
  // =========================================================================
  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function startTimer() {
    if (timerRunning) return;
    timerRunning = true;
    document.getElementById("timer-toggle-btn").textContent = "\u66AB\u505C\u8A08\u6642";
    timerInterval = setInterval(() => {
      if (timerSeconds > 0) {
        timerSeconds--;
        const timerEl = document.getElementById("quiz-timer");
        timerEl.textContent = formatTime(timerSeconds);
        if (timerSeconds <= 60) timerEl.classList.add("timer-urgent");
      } else {
        stopTimer();
        showToast("\u6E2C\u9A57\u6642\u9593\u5230\uFF01\u8ACB\u9EDE\u64CA\u4EA4\u5377\u6279\u6539\u3002", "\u23F0");
      }
    }, 1000);
  }

  function stopTimer() {
    timerRunning = false;
    clearInterval(timerInterval);
    document.getElementById("timer-toggle-btn").textContent = "\u7E7C\u7E8C\u8A08\u6642";
  }

  function toggleTimer() {
    if (timerRunning) stopTimer();
    else startTimer();
  }

  function resetTimer() {
    stopTimer();
    timerSeconds = 1800;
    const timerEl = document.getElementById("quiz-timer");
    timerEl.textContent = formatTime(timerSeconds);
    timerEl.classList.remove("timer-urgent");
  }

  // Bootstrap
  loadState();
  updatePortalSummary();
</script>
</body>
</html>
