<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>&#x79C1;&#x4E2D;&#x885D;&#x523A;&#x6A21;&#x64EC;&#x7AD9;</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f4f7fb 0%, #e9f0f8 50%, #f7f9fc 100%);
      --glass-bg: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(255, 255, 255, 0.94);
      --glass-shadow: 0 12px 36px rgba(15, 23, 42, 0.06);
      --text-main: #0f172a;
      --text-sub: #475569;
      --primary: #0f766e;
      --accent: #2563eb;
      --danger: #dc2626;
      --warning: #d97706;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
    }

    .liquid-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 24px;
    }

    .week-strip::-webkit-scrollbar {
      display: none;
    }

    .week-strip {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid rgba(203, 213, 225, 0.85);
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-main);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #93c5fd;
      background: #f8fafc;
    }

    .option-btn.selected {
      border-color: var(--accent);
      background: rgba(37, 99, 235, 0.1);
      color: #1e3a8a;
    }

    .option-btn.correct {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      color: #065f46;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: rgba(220, 38, 38, 0.1);
      color: #991b1b;
    }

    @keyframes pulseUrgent {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .timer-urgent {
      animation: pulseUrgent 1s infinite;
    }
  </style>
</head>
<body class="antialiased selection:bg-teal-100 selection:text-teal-900">

  <!-- Toast Banner (Replaces native alert) -->
  <div id="toast-banner" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 -translate-y-3 w-[90%] max-w-md">
    <div class="liquid-card px-5 py-3.5 rounded-2xl text-sm font-bold text-slate-800 flex items-center justify-center gap-2 border border-teal-200 shadow-xl text-center">
      <span id="toast-icon">&#x2728;</span>
      <span id="toast-msg"></span>
    </div>
  </div>

  <!-- 1. Ceremonial One-Click Portal Entry Lobby -->

    <div class="liquid-card w-full max-w-md p-8 sm:p-10 text-center space-y-6">

        &#x52DD;

      <div class="space-y-2">
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">
          &#x79C1;&#x4E2D;&#x885D;&#x523A;&#x6A21;&#x64EC;&#x7AD9;
        </h1>
        <p class="text-xs sm:text-sm text-slate-500 font-medium">
          &#x6DE1;&#x6C5F; &times; &#x8587;&#x95A3; 15&#x9031;&#x5165;&#x5B78;&#x8003;&#x5099;&#x8003;&#x7CFB;&#x7D71;&#xFF08;2026/11/16 &ndash; 2027/02/27&#xFF09;
        </p>
      </div>

      <div class="bg-white/90 border border-slate-200/80 rounded-2xl p-4 text-left space-y-3 shadow-sm">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-500 font-medium">&#x76EE;&#x524D;&#x63A8;&#x9032;&#x9031;&#x6B21;</span>
          <strong id="portal-week-label" class="text-teal-700 font-black">&#x7B2C; 1 &#x9031;</strong>
        </div>
        <div class="border-t border-dashed border-slate-200 pt-2.5 flex justify-between items-center text-sm">
          <span class="text-slate-500 font-medium">&#x7D2F;&#x7A4D;&#x901A;&#x95DC;&#x9032;&#x5EA6;</span>
          <strong id="portal-progress-label" class="text-slate-800 font-black">0 / 15 &#x9031;</strong>
        </div>
        <div class="border-t border-dashed border-slate-200 pt-2.5 flex justify-between items-center text-sm">
          <span class="text-slate-500 font-medium">&#x5F85;&#x8907;&#x7FD2;&#x932F;&#x984C;&#x6578;</span>
          <strong id="portal-wrong-label" class="text-rose-600 font-black">0 &#x984C;</strong>

      <button onclick="enterStudyStation()" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-teal-700 to-teal-600 hover:from-teal-800 hover:to-teal-700 text-white text-base sm:text-lg font-extrabold shadow-lg shadow-teal-700/25 transition transform active:scale-[0.98] cursor-pointer">
        &#x1F680; &#x958B;&#x59CB;&#x4ECA;&#x65E5;&#x885D;&#x523A;&#x6A21;&#x64EC; &rarr;

    </div>
  </div>

  <!-- 2. Main Study Station -->
  <div id="app-view" class="max-w-4xl mx-auto px-4 pt-5 pb-16 hidden space-y-5">
    <!-- Top Bar -->
    <header class="liquid-card px-5 py-4 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-teal-700 to-blue-600 text-white font-black text-lg flex items-center justify-center shadow-sm">
          &#x52DD;
        </div>
        <div>
          <div class="font-black text-base sm:text-lg text-slate-900 leading-tight">&#x79C1;&#x4E2D;&#x885D;&#x523A;&#x6A21;&#x64EC;&#x7AD9;</div>

      </div>
      <button onclick="returnToPortal()" class="px-4 py-2 rounded-xl border border-slate-300/80 bg-white/90 hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-bold transition cursor-pointer">
        &#x8FD4;&#x56DE;&#x9996;&#x9801;

    </header>

    <!-- 3 Summary Stat Cards -->
    <section class="grid grid-cols-3 gap-3">
      <div class="liquid-card p-4 text-center">
        <div class="text-xs text-slate-500 font-medium mb-1">&#x8DDD;&#x96E2; 2/27 &#x8003;&#x8A66;&#x5012;&#x6578;</div>
        <div id="countdown-days" class="text-xl sm:text-2xl font-black text-teal-700">-- &#x5929;</div>

      <div class="liquid-card p-4 text-center">

    <!-- Current Week Header -->

    <!-- 3-Step Workflow Tabs -->
    <section class="grid grid-cols-3 gap-2.5">
      <button id="tab-1" onclick="switchStep(1)" class="p-3.5 rounded-2xl border border-slate-300/70 bg-white/75 text-xs sm:text-sm font-extrabold text-slate-600 transition cursor-pointer">

<script>
  const STORAGE_KEY = "private_school_sprint_v4";

  // Custom Toast Banner (Replaces alert)
  function showToast(msg, icon = "\u2728") {
    const banner = document.getElementById("toast-banner");
    document.getElementById("toast-msg").textContent = msg;
    document.getElementById("toast-icon").textContent = icon;
    banner.classList.remove("opacity-0", "-translate-y-3");
    banner.classList.add("opacity-100", "translate-y-0");
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => {
      banner.classList.add("opacity-0", "-translate-y-3");
      banner.classList.remove("opacity-100", "translate-y-0");
    }, 2800);
  }

          ],
          ans: 0,
          h1: `\u5169\u8ECA\u76F8\u5411\u800C\u884C\u6642\uFF0C\u6BCF\u5C0F\u6642\u5171\u6703\u63A5\u8FD1\u591A\u5C11\u516C\u91CC\uFF1F`,
          h2: `\u901F\u7387\u548C = ${v1} + ${v2} = ${v1 + v2} \u516C\u91CC/\u6642\uFF0C\u6642\u9593 = ${dist} \u00F7 ${v1 + v2}\u3002`,
          exp: `\u6B63\u89E3\u70BA ${hrs} \u5C0F\u6642\u3002${dist} \u00F7 (${v1} + ${v2}) = ${hrs} \u5C0F\u6642\u3002`
        };
      },
      () => {
        const w = [200, 300, 400][Math.floor(Math.random() * 3)];
        const c1 = [15, 20][Math.floor(Math.random() * 2)];
        const addW = 100;
        const salt = (w * c1) / 100;
        const newConc = (salt / (w + addW)) * 100;
        return {
          id: `M_SALT_${w}_${c1}`,
          sub: "\u6578\u5B78",
          type: "\u6FC3\u5EA6\u7A00\u91CB\u554F\u984C",
          stem: `\u6709\u4E00\u676F\u6FC3\u5EA6 ${c1}% \u7684\u98DF\u9E7D\u6C34 ${w} \u516C\u514B\uFF0C\u73FE\u5728\u518D\u5012\u5165 ${addW} \u516C\u514B\u7684\u7D14\u6C34\u7A00\u91CB\u3002\u8ACB\u554F\u7A00\u91CB\u5F8C\u7684\u65B0\u6FC3\u5EA6\u662F\u591A\u5C11\uFF1F`,
          opts: [
            `${newConc}%`,
            `${c1 - 2}%`,
            `${newConc + 3}%`,
            `${c1 / 2}%`
          ],
          ans: 0,
          h1: `\u52A0\u6C34\u7A00\u91CB\u6642\u300C\u7D14\u9E7D\u91CD\u91CF\u4E0D\u8B8A\u300D\uFF0C\u5148\u7B97\u539F\u672C\u542B\u6709\u591A\u5C11\u516C\u514B\u7684\u9E7D\u3002`,
          h2: `\u7D14\u9E7D = ${w} \u00D7 ${c1}% = ${salt} \u516C\u514B\uFF0C\u65B0\u6EB6\u6DB2\u7E3D\u91CD = ${w + addW} \u516C\u514B\uFF0C\u76F8\u9664\u5373\u5F97\u65B0\u6FC3\u5EA6\u3002`,
          exp: `\u6B63\u89E3\u70BA ${newConc}%\u3002\u7D14\u9E7D ${salt} \u516C\u514B \u00F7 ${w + addW} \u516C\u514B = ${newConc}%\u3002`
        };
      }
    ];
    return templates.map(fn => fn());
  }

  // State Management
  let state = {
    currentWeek: 1,
    currentStep: 1,
    completedWeeks: [],
    solvedIds: [],
    wrongBook: []
  };

  let activeQuestions = [];
  let userAnswers = {};
  let quizSubmitted = false;
  let timerSeconds = 1800;
  let timerInterval = null;
  let timerRunning = false;

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        state = Object.assign(state, JSON.parse(saved));
      }
    } catch (e) {}
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
    updatePortalSummary();
  }

  function updatePortalSummary() {
    document.getElementById("portal-week-label").textContent = `\u7B2C ${state.currentWeek} \u9031`;
    document.getElementById("portal-progress-label").textContent = `${state.completedWeeks.length} / 15 \u9031`;
    document.getElementById("portal-wrong-label").textContent = `${state.wrongBook.length} \u984C`;
  }

  function enterStudyStation() {
    document.getElementById("portal-view").classList.add("hidden");
    document.getElementById("app-view").classList.remove("hidden");
    renderAll();
    switchStep(state.currentStep || 1);
  }

  function returnToPortal() {
    stopTimer();
    updatePortalSummary();
    document.getElementById("app-view").classList.add("hidden");
    document.getElementById("portal-view").classList.remove("hidden");
  }

  function calcDaysToExam() {
    const examDate = new Date("2027-02-27T08:00:00+08:00");
    const now = new Date();
    const diff = Math.ceil((examDate - now) / (1000 * 60 * 60 * 24));
    return diff > 0 ? diff : 0;
  }

  function renderAll() {
    document.getElementById("countdown-days").textContent = `${calcDaysToExam()} \u5929`;
    document.getElementById("completed-count").textContent = `${state.completedWeeks.length} / 15`;
    document.getElementById("solved-unique-count").textContent = `${state.solvedIds.length} \u984C`;

    // Render Week Strip
    const strip = document.getElementById("week-strip");
    strip.innerHTML = "";
    WEEKS_DATA.forEach(item => {
      const btn = document.createElement("button");
      const isDone = state.completedWeeks.includes(item.w);
      const isActive = item.w === state.currentWeek;
      btn.className = `flex-none px-4 py-2.5 rounded-2xl border text-xs font-extrabold flex flex-col items-center min-w-[82px] transition cursor-pointer ${
        isActive
          ? "bg-teal-700 text-white border-teal-700 shadow-md"
          : isDone
            ? "bg-white/90 text-slate-800 border-emerald-400"
            : "bg-white/75 text-slate-600 border-slate-200 hover:bg-white"
      }`;
      btn.innerHTML = `<span>W${item.w}</span><span class="text-[11px] mt-0.5 opacity-90">${isDone ? "\u2705 \u5DF2\u904E\u95DC" : "\u885D\u523A\u4E2D"}</span>`;
      btn.onclick = () => selectWeek(item.w);
      strip.appendChild(btn);
    });

    // Current Week Header
    const wObj = WEEKS_DATA.find(x => x.w === state.currentWeek) || WEEKS_DATA[0];
    document.getElementById("week-date-range").textContent = wObj.range;
    document.getElementById("current-week-badge").textContent = `\u7B2C ${wObj.w} \u9031\u9032\u5EA6`;
    document.getElementById("current-week-title").textContent = wObj.title;
    const passed = state.completedWeeks.includes(wObj.w);
    const statusEl = document.getElementById("week-pass-status");
    statusEl.textContent = passed ? "\u2705 \u672C\u9031\u5DF2\u9054\u6A19" : "\u23F3 \u5C1A\u672A\u901A\u95DC";
    statusEl.className = passed ? "text-xs sm:text-sm font-extrabold text-emerald-600" : "text-xs sm:text-sm font-extrabold text-slate-500";

    // Render Flashcards
    const fcGrid = document.getElementById("flashcard-grid");
    fcGrid.innerHTML = "";
    wObj.cards.forEach(c => {
      const card = document.createElement("div");
      card.className = `liquid-card p-5 border-t-4 ${c.border}`;
      card.innerHTML = `
        <span class="inline-block px-3 py-1 rounded-full text-xs font-extrabold ${c.badge} mb-3">${c.sub}</span>
        <div class="font-extrabold text-base text-slate-900 mb-2">${c.h}</div>
        <div class="text-sm text-slate-600 leading-relaxed">${c.b}</div>
      `;
      fcGrid.appendChild(card);
    });

    if (activeQuestions.length === 0) {
      buildQuizSet();
    }
    renderWrongBook();
  }

  function selectWeek(w) {
    state.currentWeek = w;
    state.currentStep = 1;
    saveState();
    buildQuizSet();
    renderAll();
    switchStep(1);
  }

  function switchStep(step) {
    state.currentStep = step;
    saveState();
    [1, 2, 3].forEach(i => {
      const tab = document.getElementById(`tab-${i}`);
      const panel = document.getElementById(`step-${i}-panel`);
      if (i === step) {
        tab.className = "p-3.5 rounded-2xl border-2 border-teal-700 bg-white text-xs sm:text-sm font-black text-teal-800 shadow-sm transition cursor-pointer";
        panel.classList.remove("hidden");
      } else {
        tab.className = "p-3.5 rounded-2xl border border-slate-300/70 bg-white/75 text-xs sm:text-sm font-extrabold text-slate-500 hover:bg-white transition cursor-pointer";
        panel.classList.add("hidden");
      }
    });
    if (step === 2) {
      if (!quizSubmitted && !timerRunning) startTimer();
    } else {
      stopTimer();
    }
    if (step === 3) {
      renderWrongBook();
    }
  }

  function shuffleArray(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Pick unattempted questions first to prevent repetition
  function pickQuestionsBySubject(sub, count) {
    const pool = STATIC_BANK.filter(q => q.sub === sub);
    const unseen = pool.filter(q => !state.solvedIds.includes(q.id));
    const seen = pool.filter(q => state.solvedIds.includes(q.id));
    const ordered = [...shuffleArray(unseen), ...shuffleArray(seen)];
    return ordered.slice(0, count).map(q => {
      const correctText = q.opts[q.ans];
      const shuffledOpts = shuffleArray(q.opts);
      return Object.assign({}, q, {
        opts: shuffledOpts,
        ans: shuffledOpts.indexOf(correctText)
      });
    });
  }

  function buildQuizSet() {
    const chiQs = pickQuestionsBySubject("\u570B\u6587", 2);
    const engQs = pickQuestionsBySubject("\u82F1\u6587", 2);
    const mathRaw = shuffleArray(generateMathQuestions()).slice(0, 2).map(q => {
      const correctText = q.opts[q.ans];
      const shuffledOpts = shuffleArray(q.opts);
      return Object.assign({}, q, {
        opts: shuffledOpts,
        ans: shuffledOpts.indexOf(correctText)
      });
    });
    activeQuestions = [...chiQs, ...mathRaw, ...engQs];
    userAnswers = {};
    quizSubmitted = false;
    document.getElementById("quiz-submit-area").classList.remove("hidden");
    document.getElementById("quiz-result-banner").classList.add("hidden");
    renderQuizQuestions();
  }

  function refreshNewQuestions() {
    buildQuizSet();
    resetTimer();
    startTimer();
    showToast("\u5DF2\u5F9E\u984C\u5EAB\u62BD\u53D6\u5168\u65B0\u672A\u5BEB\u904E\u7684\u984C\u76EE\uFF01", "\uD83D\uDD04");
  }

  function renderQuizQuestions() {
    const container = document.getElementById("quiz-questions-container");
    container.innerHTML = "";
    activeQuestions.forEach((q, idx) => {
      const card = document.createElement("div");
      card.className = "liquid-card p-5 sm:p-6";

      const optsHtml = q.opts.map((opt, oIdx) => {
        let cls = "option-btn";
        if (quizSubmitted) {
          if (oIdx === q.ans) cls += " correct";
          else if (userAnswers[idx] === oIdx) cls += " wrong";
        } else if (userAnswers[idx] === oIdx) {
          cls += " selected";
        }
        return `<button class="${cls}" ${quizSubmitted ? "disabled" : ""} onclick="selectOption(${idx}, ${oIdx})">${String.fromCharCode(65 + oIdx)}. ${opt}</button>`;
      }).join("");

      card.innerHTML = `
        <div class="flex justify-between items-center gap-2 mb-3">
          <div>
            <span class="inline-block px-3 py-1 rounded-full text-xs font-extrabold bg-teal-50 text-teal-800">${q.sub} &middot; ${q.type}</span>
            <strong class="ml-2 text-sm sm:text-base text-slate-900">\u7B2C ${idx + 1} \u984C</strong>
          </div>
          <button class="px-3 py-1.5 rounded-xl border border-amber-200 bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-bold cursor-pointer" onclick="showHint(${idx})">&#x1F4A1; \u63D0\u793A</button>
        </div>
        <div class="text-base font-bold text-slate-900 whitespace-pre-line mb-4">${q.stem}</div>
        <div class="flex flex-col gap-2.5">${optsHtml}</div>
        <div class="mt-3 p-3.5 rounded-xl bg-amber-50/90 border border-amber-200 text-amber-950 text-xs sm:text-sm hidden" id="hint-${idx}" data-level="0"></div>
        ${quizSubmitted ? `<div class="mt-4 p-4 rounded-xl bg-slate-50 border-l-4 border-teal-700 text-xs sm:text-sm text-slate-700"><strong>\u89E3\u6790\uFF1A</strong>${q.exp}</div>` : ""}
      `;
      container.appendChild(card);
    });
  }

  function selectOption(qIdx, oIdx) {
    if (quizSubmitted) return;
    userAnswers[qIdx] = oIdx;
    renderQuizQuestions();
  }

  function showHint(idx) {
    const box = document.getElementById(`hint-${idx}`);
    const q = activeQuestions[idx];
    const lvl = parseInt(box.getAttribute("data-level") || "0", 10);
    box.classList.remove("hidden");
    if (lvl === 0) {
      box.innerHTML = `<strong>\u63D0\u793A 1\uFF08\u601D\u8DEF\u5F15\u5C0E\uFF09\uFF1A</strong>${q.h1}`;
      box.setAttribute("data-level", "1");
    } else {
      box.innerHTML = `<strong>\u63D0\u793A 1\uFF1A</strong>${q.h1}<br><strong>\u63D0\u793A 2\uFF08\u95DC\u9375\u6B65\u9A5F\uFF09\uFF1A</strong>${q.h2}`;
      box.setAttribute("data-level", "2");
    }
  }

  function submitQuiz() {
    if (Object.keys(userAnswers).length < activeQuestions.length) {
      showToast("\u9084\u6709\u984C\u76EE\u5C1A\u672A\u4F5C\u7B54\u5594\uFF01\u8ACB\u5148\u5B8C\u6210\u6240\u6709\u984C\u76EE\u518D\u4EA4\u5377\u3002", "\u26A0\uFE0F");
      return;
    }
    stopTimer();
    quizSubmitted = true;

    let correctCount = 0;
    activeQuestions.forEach((q, idx) => {
      if (!state.solvedIds.includes(q.id)) {
        state.solvedIds.push(q.id);
      }
      if (userAnswers[idx] === q.ans) {
        correctCount++;
      } else {
        if (!state.wrongBook.some(w => w.id === q.id)) {
          state.wrongBook.unshift(q);
        }
      }
    });

    const score = Math.round((correctCount / activeQuestions.length) * 100);
    if (score >= 80 && !state.completedWeeks.includes(state.currentWeek)) {
      state.completedWeeks.push(state.currentWeek);
      if (state.currentWeek < 15) {
        state.currentWeek += 1;
      }
    }

    saveState();
    renderAll();
    renderQuizQuestions();

    document.getElementById("quiz-submit-area").classList.add("hidden");
    const banner = document.getElementById("quiz-result-banner");
    banner.classList.remove("hidden");
    document.getElementById("result-score-text").textContent = `\u672C\u6B21\u5F97\u5206\uFF1A${score} \u5206\uFF08\u7B54\u5C0D ${correctCount} / ${activeQuestions.length} \u984C\uFF09`;
    document.getElementById("result-feedback-text").textContent = score >= 80
      ? "\u592A\u68D2\u4E86\uFF01\u9054\u6210 80 \u5206\u901A\u95DC\u6A19\u6E96\uFF0C\u5DF2\u81EA\u52D5\u89E3\u9396\u4E26\u63A8\u9032\u9032\u5EA6\u3002"
      : "\u5C1A\u672A\u9054 80 \u5206\u901A\u95DC\u9580\u6ABB\uFF0C\u5EFA\u8B70\u5148\u5230\u300C\u6B65\u9A5F\u4E09\uFF1A\u932F\u984C\u8907\u7FD2\u300D\u641E\u61C2\u89E3\u6790\uFF0C\u518D\u63DB\u65B0\u984C\u6311\u6230\u4E00\u6B21\uFF01";
    banner.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function renderWrongBook() {
    const box = document.getElementById("wrong-book-container");
    if (state.wrongBook.length === 0) {
      box.innerHTML = `<div class="liquid-card p-10 text-center text-slate-500">
        <div class="text-4xl mb-3">&#x1F389;</div>
        <div class="font-extrabold text-base text-slate-800">\u76EE\u524D\u6C92\u6709\u5F85\u8907\u7FD2\u7684\u932F\u984C\uFF01</div>
        <div class="text-xs sm:text-sm mt-1">\u7E7C\u7E8C\u4FDD\u6301\uFF0C\u524D\u5F80\u6B65\u9A5F\u4E8C\u6311\u6230\u66F4\u591A\u65B0\u984C\u5427\u3002</div>
      </div>`;
      return;
    }
    box.innerHTML = state.wrongBook.map((q, idx) => `
      <div class="liquid-card p-5 sm:p-6">
        <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
          <span class="inline-block px-3 py-1 rounded-full text-xs font-extrabold bg-rose-50 text-rose-700">${q.sub} &middot; ${q.type}</span>
          <button class="px-3.5 py-1.5 rounded-xl border border-emerald-500 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold cursor-pointer" onclick="markMastered(${idx})">&#x2705; \u6211\u5DF2\u5B8C\u5168\u641E\u61C2\uFF08\u79FB\u9664\uFF09</button>
        </div>
        <div class="text-base font-bold text-slate-900 whitespace-pre-line mb-3">${q.stem}</div>
        <div class="font-extrabold text-sm text-emerald-700 mb-2">\u6B63\u78BA\u7B54\u6848\uFF1A${q.opts[q.ans]}</div>
        <div class="p-4 rounded-xl bg-slate-50 border-l-4 border-teal-700 text-xs sm:text-sm text-slate-700"><strong>\u767D\u8A71\u89E3\u6790\uFF1A</strong>${q.exp}</div>
      </div>
    `).join("");
  }

  function markMastered(idx) {
    state.wrongBook.splice(idx, 1);
    saveState();
    renderAll();
    showToast("\u5DF2\u5F9E\u932F\u984C\u672C\u79FB\u9664\u6B64\u984C\uFF01", "\u2705");
  }

  // Timer Logic
  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function startTimer() {
    if (timerRunning) return;
    timerRunning = true;
    document.getElementById("timer-toggle-btn").textContent = "\u66AB\u505C\u8A08\u6642";
    timerInterval = setInterval(() => {
      if (timerSeconds > 0) {
        timerSeconds--;
        const timerEl = document.getElementById("quiz-timer");
        timerEl.textContent = formatTime(timerSeconds);
        if (timerSeconds <= 60) {
          timerEl.classList.add("timer-urgent");
        }
      } else {
        stopTimer();
        showToast("\u6E2C\u9A57\u6642\u9593\u5230\uFF01\u8ACB\u9EDE\u64CA\u4EA4\u5377\u6279\u6539\u3002", "\u23F0");
      }
    }, 1000);
  }

  function stopTimer() {
    timerRunning = false;
    clearInterval(timerInterval);
    document.getElementById("timer-toggle-btn").textContent = "\u7E7C\u7E8C\u8A08\u6642";
  }

  function toggleTimer() {
    if (timerRunning) stopTimer();
    else startTimer();
  }

  function resetTimer() {
    stopTimer();
    timerSeconds = 1800;
    const timerEl = document.getElementById("quiz-timer");
    timerEl.textContent = formatTime(timerSeconds);
    timerEl.classList.remove("timer-urgent");
  }

  // Init
  loadState();
  updatePortalSummary();
</script>
</body>
</html>
