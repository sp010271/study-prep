<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>&#x79C1;&#x4E2D;&#x885D;&#x523A;&#x6A21;&#x64EC;&#x7AD9;</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f4f7fb 0%, #e9f0f8 50%, #f7f9fc 100%);
      --glass-bg: rgba(255, 255, 255, 0.86);
      --glass-border: rgba(255, 255, 255, 0.96);
      --glass-shadow: 0 12px 36px rgba(15, 23, 42, 0.06);
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --primary-soft: rgba(15, 118, 110, 0.1);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.1);
      --purple: #7c3aed;
      --purple-soft: rgba(124, 58, 237, 0.1);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.1);
      --warning: #d97706;
      --warning-soft: rgba(217, 119, 6, 0.14);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.65;
    }

    .liquid-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: var(--radius-lg);
    }

    .container {
      max-width: 940px;
      margin: 0 auto;
      padding: 16px 14px 72px;
    }

    /* Portal Lobby */
    #portal-view {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .portal-box {
      width: 100%;
      max-width: 460px;
      padding: 36px 26px;
      text-align: center;
    }

    .portal-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 22px;
      background: linear-gradient(135deg, #0f766e 0%, #2563eb 100%);
      color: #ffffff;
      font-size: 32px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.25);
    }

    .portal-title {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 8px;
      letter-spacing: 0.5px;
    }

    .portal-sub {
      font-size: 14px;
      color: var(--text-sub);
      margin: 0 0 24px;
    }

    .portal-status-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(203, 213, 225, 0.65);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 22px;
      text-align: left;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      padding: 8px 0;
    }

    .status-row + .status-row {
      border-top: 1px dashed rgba(203, 213, 225, 0.75);
    }

    .status-label {
      color: var(--text-sub);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-value {
      font-weight: 700;
      text-align: right;
      font-size: 13px !important;
      white-space: normal !important;
      word-break: break-all;
      max-width: 62%;
    }

    .btn-primary {
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 118, 110, 0.25);
      transition: transform 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      padding: 10px 14px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:active {
      background: #f1f5f9;
    }

    /* Main Header & Stats */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      margin-bottom: 14px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mini-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, #0f766e, #2563eb);
      color: #fff;
      font-weight: 800;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      padding: 14px 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
    }

    /* 15 Weeks Strip (Restored visible, sleek custom scrollbar for horizontal sliding) */
    .week-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 14px;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .week-strip::-webkit-scrollbar {
      height: 6px;
    }

    .week-strip::-webkit-scrollbar-track {
      background: rgba(203, 213, 225, 0.25);
      border-radius: 10px;
    }

    .week-strip::-webkit-scrollbar-thumb {
      background: rgba(15, 118, 110, 0.4);
      border-radius: 10px;
    }

    .week-strip::-webkit-scrollbar-thumb:hover {
      background: rgba(15, 118, 110, 0.7);
    }

    .week-pill {
      flex: 0 0 auto;
      padding: 9px 13px;
      border-radius: 14px;
      border: 1px solid rgba(203, 213, 225, 0.75);
      background: rgba(255, 255, 255, 0.8);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 76px;
    }

    .week-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 6px 14px rgba(15, 118, 110, 0.25);
    }

    .week-pill.done {
      border-color: #10b981;
    }

    /* Step Tabs */
    .step-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .step-tab {
      padding: 13px 8px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(203, 213, 225, 0.75);
      background: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      text-align: center;
    }

    .step-tab.active {
      background: #ffffff;
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
    }

    /* Teaching Library (Step 1) */
    .sub-filter-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .sub-pill {
      padding: 11px 8px;
      border-radius: 12px;
      border: 1px solid rgba(203, 213, 225, 0.8);
      background: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      text-align: center;
    }

    .sub-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .lecture-item {
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid var(--primary);
    }

    .lecture-item.dlc {
      border-left-color: var(--purple);
      background: rgba(250, 245, 255, 0.92);
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .badge.dlc {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .badge.diff-basic { background: #dcfce7; color: #166534; }
    .badge.diff-mid { background: #dbeafe; color: #1e40af; }
    .badge.diff-hard { background: #fee2e2; color: #991b1b; }

    /* Sticky Exam HUD (Step 2) */
    .exam-hud {
      position: sticky;
      top: 8px;
      z-index: 40;
      padding: 12px 14px;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(203, 213, 225, 0.95);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border-radius: 18px;
    }

    .hud-top-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .timer-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 18px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 10px;
      background: var(--danger-soft);
      color: var(--danger);
    }

    /* Subject Priority Filter Bar inside Step 2 */
    .exam-sub-filter {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .exam-sub-pill {
      padding: 10px 6px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .exam-sub-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
    }

    @media (min-width: 680px) {
      .mini-grid {
        grid-template-columns: repeat(15, 1fr);
      }
    }

    .mini-cell {
      height: 28px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .mini-cell.answered {
      background: #10b981;
      color: #ffffff;
      border-color: #059669;
    }

    .mini-cell.flagged {
      border: 2px solid #f59e0b;
      box-shadow: 0 0 0 1px #f59e0b;
    }

    /* Question Cards & Child-Friendly Reading / Option Controls */
    .q-card {
      padding: 20px 18px;
      margin-bottom: 18px;
      scroll-margin-top: 195px;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .q-stem {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      white-space: pre-line;
      line-height: 1.8;
    }

    /* Sticky/Collapsible Reading Passage Box */
    .reading-passage-box {
      position: sticky;
      top: 176px;
      z-index: 20;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-left: 4px solid var(--accent);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
    }

    .reading-passage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .reading-passage-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.85;
      white-space: pre-line;
      max-height: 180px;
      overflow-y: auto;
    }

    .reading-passage-text.collapsed {
      max-height: 44px;
      overflow: hidden;
      opacity: 0.75;
    }

    .q-img-wrap {
      margin: 12px 0 16px;
      text-align: center;
    }

    .q-img-wrap img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      cursor: zoom-in;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .option-btn {
      flex: 1;
      min-height: 50px;
      text-align: left;
      padding: 13px 16px;
      border-radius: var(--radius-sm);
      border: 1.5px solid rgba(203, 213, 225, 0.9);
      background: rgba(255, 255, 255, 0.96);
      color: var(--text-main);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #1e3a8a;
    }

    .option-btn.eliminated {
      text-decoration: line-through;
      opacity: 0.45;
      background: #f1f5f9;
    }

    .option-btn.correct {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.16);
      color: #065f46;
      opacity: 1;
      text-decoration: none;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: #991b1b;
      opacity: 1;
      text-decoration: none;
    }

    .elim-btn {
      flex: 0 0 48px;
      border-radius: var(--radius-sm);
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .elim-btn.active {
      background: #fee2e2;
      color: var(--danger);
      border-color: #fca5a5;
    }

    .flag-btn {
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-sub);
    }

    .flag-btn.active {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #b45309;
    }

    /* Listening Audio Player Box */
    .listening-box {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border: 1.5px solid #86efac;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Post-Exam Answer Comparison Strip */
    .answer-compare-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    @media (min-width: 560px) {
      .answer-compare-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .compare-pill-wrong {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--danger-soft);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #991b1b;
      font-size: 13px;
      font-weight: 700;
    }

    .compare-pill-correct {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #065f46;
      font-size: 13px;
      font-weight: 700;
    }

    .hint-box {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--warning-soft);
      color: #92400e;
      font-size: 14px;
      display: none;
    }

    .explain-box {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      font-size: 14px;
      color: var(--text-sub);
    }

    /* Scratchpad Drawer & Lightbox Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .scratchpad-box {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    #scratch-canvas {
      width: 100%;
      height: 310px;
      border: 1.5px dashed #94a3b8;
      border-radius: 12px;
      background: #fffbeb;
      touch-action: none;
      cursor: crosshair;
      display: block;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- 1. Minimalist One-Click Portal Entry Lobby -->
  <div id="portal-view">
    <div class="liquid-card portal-box">
      <div class="portal-badge">&#x52DD;</div>
      <h1 class="portal-title">&#x79C1;&#x4E2D;&#x885D;&#x523A;&#x6A21;&#x64EC;&#x7AD9;</h1>
      <p class="portal-sub">&#x6DE1;&#x6C5F; &times; &#x8587;&#x95A3; 15&#x9031;&#x5165;&#x5B78;&#x8003;&#x5099;&#x8003;&#x7CFB;&#x7D71;&#xFF08;2026/11/16 &ndash; 2027/02/27&#xFF09;</p>

      <div class="portal-status-card">
        <div class="status-row">
          <span class="status-label">&#x76EE;&#x524D;&#x63A8;&#x9032;&#x9031;&#x6B21;</span>
          <span class="status-value" id="portal-week-label" style="color:var(--primary);">&#x7B2C; 1 &#x9031;</span>
        </div>
        <div class="status-row">
          <span class="status-label">&#x7D2F;&#x7A4D;&#x901A;&#x95DC;&#x9032;&#x5EA6;</span>
          <span class="status-value" id="portal-progress-label">0 / 15 &#x9031;</span>
        </div>
        <div class="status-row">
          <span class="status-label">&#x5F85;&#x8907;&#x7FD2;&#x932F;&#x984C;&#x6578;</span>
          <span class="status-value" id="portal-wrong-label" style="color:var(--danger);">0 &#x984C;</span>
        </div>
        <div class="status-row">
          <span class="status-label">&#x96F2;&#x7AEF;&#x984C;&#x5Eab;&#x540C;&#x6B65;&#x72C0;&#x614B;</span>
          <span class="status-value" id="dlc-status-label" style="color:var(--purple);">&#x540C;&#x6B65;&#x4E2D;...</span>
        </div>
      </div>

      <button class="btn-primary" onclick="enterStudyStation()">
        &#x1F680; &#x958B;&#x59CB;&#x4ECA;&#x65E5;&#x885D;&#x523A;&#x6A21;&#x64EC; &rarr;
      </button>

      <div style="margin-top:12px;">
        <button class="btn-secondary" style="width:100%;" onclick="syncCloudDLC(true)">
          &#x1F504; &#x7ACB;&#x5373;&#x540C;&#x6B65;&#x6700;&#x65B0;&#x984C;&#x5EAB;
        </button>
      </div>
    </div>
  </div>

  <!-- 2. Main Study Station -->
  <div id="app-view" class="container hidden">
    <div class="liquid-card top-bar">
      <div class="brand-group">
        <div class="brand-mini-icon">&#x52DD;</div>
        <div>
          <div style="font-weight:800;font-size:16px;">&#x79C1;&#x4E2D;&#x885D;&#x523A;&#x6A21;&#x64EC;&#x7AD9;</div>
          <div id="week-date-range" style="font-size:12px;color:var(--text-sub);"></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-secondary" onclick="returnToPortal()">&#x8FD4;&#x56DE;&#x9996;&#x9801;</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="liquid-card stat-card">
        <div class="stat-label">&#x8DDD;&#x96E2; 2/27 &#x8003;&#x8A66;&#x5012;&#x6578;</div>
        <div class="stat-val" id="countdown-days">-- &#x5929;</div>
      </div>
      <div class="liquid-card stat-card">
        <div class="stat-label">&#x5B8C;&#x6210;&#x9031;&#x6B21;&#x9032;&#x5EA6;</div>
        <div class="stat-val" id="completed-count">0 / 15</div>
      </div>
      <div class="liquid-card stat-card">
        <div class="stat-label">&#x7D2F;&#x7A4D;&#x5DF2;&#x5237;&#x65B0;&#x984C;</div>
        <div class="stat-val" id="solved-unique-count">0 &#x984C;</div>
      </div>
    </div>

    <!-- 15 Weeks Strip (With visible custom scrollbar) -->
    <div class="week-strip" id="week-strip"></div>

    <!-- Current Week Header -->
    <div class="liquid-card" style="padding:16px 18px;margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">

  function makeContentId(sub, stem) {
    const clean = (sub + "_" + String(stem || "").replace(/\s+/g, "").slice(0, 24));
    let hash = 0;
    for (let i = 0; i < clean.length; i++) {
      hash = ((hash << 5) - hash) + clean.charCodeAt(i);
      hash |= 0;
    }
    return "ID_" + Math.abs(hash).toString(36);
  }

  function normalizeImageUrl(url) {
    if (!url) return "";
    const trimmed = url.trim();
    const m1 = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (m1 && m1[1]) return `https://lh3.googleusercontent.com/d/${m1[1]}`;
    const m2 = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m2 && m2[1] && trimmed.includes("drive.google.com")) {
      return `https://lh3.googleusercontent.com/d/${m2[1]}`;
    }
    return trimmed;
  }

  function parseCSV(text) {
    const rows = [];
    let row = [];
    let cur = "";
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const next = text[i + 1];
      if (inQuotes) {
        if (ch === '"' && next === '"') {
          cur += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = false;
        } else {
          cur += ch;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
        } else if (ch === ",") {
          row.push(cur.trim());
          cur = "";
        } else if (ch === "\r" && next === "\n") {
          row.push(cur.trim());
          rows.push(row);
          row = [];
          cur = "";
          i++;
        } else if (ch === "\n" || ch === "\r") {
          row.push(cur.trim());
          rows.push(row);
          row = [];
          cur = "";
        } else {
          cur += ch;
        }
      }
    }
    if (cur.length > 0 || row.length > 0) {
      row.push(cur.trim());
      rows.push(row);
    }
    return rows;
  }

  async function syncCloudDLC(manual = false) {
    const label = document.getElementById("dlc-status-label");
    if (label) label.textContent = "\u540C\u6B65\u4E2D...";
    const ts = Date.now();
    const lecUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("\u8B1B\u7FA9DLC")}&_t=${ts}`;
    const qUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("\u984C\u5EABDLC")}&_t=${ts}`;

    try {
      const [lecRes, qRes] = await Promise.all([fetch(lecUrl), fetch(qUrl)]);
      if (!lecRes.ok || !qRes.ok) throw new Error("Fetch failed");
      const [lecCsv, qCsv] = await Promise.all([lecRes.text(), qRes.text()]);

      const lecRows = parseCSV(lecCsv).slice(1).filter(r => r.length >= 4 && r[0] && r[2]);
      const parsedLecs = lecRows.map(r => ({
        sub: r[0],
        cat: r[1] || "\u96F2\u7AEF\u64F4\u5145\u7CBE\u83EF",
        title: r[2],
        body: r[3],
        img: normalizeImageUrl(r[4] || ""),
        isDLC: true
      }));

      const qRows = parseCSV(qCsv).slice(1).filter(r => r.length >= 10 && r[0] && r[3]);
      const ansMap = { A: 0, B: 1, C: 2, D: 3 };
      const parsedQs = qRows.map(r => {
        const ansIdx = ansMap[(r[9] || "A").toUpperCase()] ?? 0;
        let rawStem = r[3];
        let passageText = "";
        if (rawStem.includes("||")) {
          const parts = rawStem.split("||");
          passageText = parts[0].trim();
          rawStem = parts[1].trim();
        }
        return {
          id: makeContentId(r[0], rawStem),
          sub: r[0],
          diff: r[1] || "\u9032\u968E",
          type: r[2] || "\u96F2\u7AEF\u7CBE\u9078",
          stem: rawStem,
          passage: passageText,
          img: normalizeImageUrl(r[4] || ""),
          opts: [r[5] || "", r[6] || "", r[7] || "", r[8] || ""],
          ans: ansIdx,
          h1: r[10] || "\u8ACB\u4ED4\u7D30\u6BD4\u5C0D\u984C\u5E79\u95DC\u9375\u689D\u4EF6\u3002",
          h2: r[11] || "\u6392\u9664\u660E\u986F\u932F\u8AA4\u9078\u9805\u5F8C\u518D\u5224\u65B7\u3002",
          exp: r[12] || "\u8ACB\u53C3\u8003\u6B63\u78BA\u7B54\u6848\u89E3\u6790\u3002",
          isDLC: true
        };
      });

      state.dlcLectures = parsedLecs;
      state.dlcQuestions = parsedQs;
      const now = new Date();
      state.lastSyncTime = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
      saveState();

      if (manual) {
        alert(`\u540C\u6B65\u5B8C\u6210\uff01\u5DF2\u8F09\u5165 ${parsedLecs.length} \u5247\u8B1B\u7FA9\u3001${parsedQs.length} \u984C\u984C\u5EAB\u3002`);
      }
    } catch (err) {
      updatePortalSummary(true);
      if (manual) {
        alert("\u96F2\u7AEF\u8A66\u7B97\u8868\u540C\u6B65\u66AB\u6642\u7121\u6CD5\u9023\u7DDA\uff0c\u7CFB\u7D71\u5DF2\u81EA\u52D5\u555F\u7528\u7DE8\u865F\u4FDD\u5E95\u6A54\uff01");
      }
    }
  }

    const examDate = new Date("2027-02-27T08:00:00+08:00");

    return diff > 0 ? diff : 0;
  }

  function switchLectureSub(subKey) {
    activeLectureSub = subKey;
    ["chi", "math", "eng"].forEach(k => {
      document.getElementById(`lec-tab-${k}`).classList.toggle("active", k === subKey);
    });
    renderLectures();
  }

  function renderLectures() {
    const subNameMap = { chi: "\u570B\u6587", math: "\u6578\u5B78", eng: "\u82F1\u6587" };
    const targetSub = subNameMap[activeLectureSub];
    const list = state.dlcLectures.filter(l => l.sub === targetSub);

    document.getElementById("lecture-count-badge").textContent = `\u672C\u79D1\u5171 ${list.length} \u9805`;

    const container = document.getElementById("lecture-list-container");
    if (list.length === 0) {
      container.innerHTML = `<div class="liquid-card" style="padding:24px;text-align:center;color:var(--text-sub);">\u66AB\u7121\u96F2\u7AEF\u8B1B\u7FA9\uff0c\u8ACB\u9ede\u64CA「立即同步最新題庫」按鈕載入。</div>`;
      document.getElementById("warmup-container").innerHTML = "";
      return;
    }

    container.innerHTML = list.map(item => `
      <div class="liquid-card lecture-item dlc">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span class="badge dlc">&#x2601;&#xFE0F; \u96F2\u7AEF\u8B1B\u7FA9 &middot; ${item.cat}</span>
        </div>
        <div style="font-weight:800;font-size:15px;margin-bottom:4px;">${item.title}</div>
        <div style="font-size:14px;color:var(--text-sub);white-space:pre-line;">${item.body}</div>
        ${item.img ? `<div class="q-img-wrap"><img src="${item.img}" onclick="zoomImg('${item.img}')" /></div>` : ""}
      </div>
    `).join("");

    const wBox = document.getElementById("warmup-container");
    const sampleLecs = list.slice(0, 3);
    wBox.innerHTML = sampleLecs.map((l, idx) => `
      <div style="padding:12px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:10px;background:#fff;">
        <div style="font-weight:700;font-size:14px;margin-bottom:6px;">&#x1F4D1; \u91CD\u9EDE\u6838\u5B58 ${idx+1}：${l.title}</div>
        <div style="font-size:13px;color:var(--text-sub);margin-bottom:8px;">${l.body.slice(0, 45)}...</div>
        <div style="font-size:12px;color:var(--primary);font-weight:700;">&#x2705; \u5DF2\u5B8C\u6210\u672C\u9805\u77AD\u89E3與重點複習</div>
      </div>
    `).join("");
  }

  function shuffleArray(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function pickTenForSubject(subName) {
    const pool = state.dlcQuestions.filter(q => q.sub === subName);
    const unseen = pool.filter(q => !state.solvedIds.includes(q.id));
    const seen = pool.filter(q => state.solvedIds.includes(q.id));
    const combined = [...shuffleArray(unseen), ...shuffleArray(seen)];
    const chosen = combined.slice(0, 10);
    return chosen.map(q => {
      const correctText = q.opts[q.ans];
      const shuffledOpts = shuffleArray(q.opts);
      return Object.assign({}, q, {
        opts: shuffledOpts,
        ans: shuffledOpts.indexOf(correctText)
      });
    });
  }

  function buildExam30() {
    const chi10 = pickTenForSubject("\u570B\u6587");
    const math10 = pickTenForSubject("\u6578\u5B78");
    const eng10 = pickTenForSubject("\u82F1\u6587");

    activeQuestions = [...chi10, ...math10, ...eng10];
    userAnswers = {};
    eliminatedMap = {};
    flaggedMap = {};
    collapsedPassageMap = {};
    quizSubmitted = false;
    activeExamSubFilter = "all";

    updateExamSubFilterUI("all");

    document.getElementById("quiz-submit-area").classList.remove("hidden");
    document.getElementById("quiz-result-banner").classList.add("hidden");
    renderMiniGrid();
    renderQuizQuestions();
  }

  function updateExamSubFilterUI(sub) {
    const mapKeys = { "all": "all", "\u570B\u6587": "chi", "\u6578\u5B78": "math", "\u82F1\u6587": "eng" };
    ["all", "chi", "math", "eng"].forEach(k => {
      const btn = document.getElementById(`exam-sub-${k}`);
      if (btn) {
        const targetVal = Object.keys(mapKeys).find(pk => mapKeys[pk] === k);
        btn.classList.toggle("active", targetVal === sub);
      }
    });
  }

  function filterExamSub(sub) {
    activeExamSubFilter = sub;
    updateExamSubFilterUI(sub);
    renderQuizQuestions();
  }

  function refreshNewQuestions() {
    buildExam30();
    resetTimer();
    startTimer();
  }

  function renderMiniGrid() {
    const grid = document.getElementById("mini-answer-grid");
    grid.innerHTML = "";
    let answeredCount = 0;
    activeQuestions.forEach((_, idx) => {
      const hasAns = userAnswers[idx] !== undefined;
      if (hasAns) answeredCount++;
      const cell = document.createElement("button");
      cell.className = `mini-cell ${hasAns ? "answered" : ""} ${flaggedMap[idx] ? "flagged" : ""}`;
      cell.textContent = idx + 1;
      cell.onclick = () => {
        const el = document.getElementById(`q-card-${idx}`);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      grid.appendChild(cell);
    });
    document.getElementById("answered-progress-text").textContent = `${answeredCount} / 30`;
  }

  function togglePassageCollapse(idx) {
    collapsedPassageMap[idx] = !collapsedPassageMap[idx];
    renderQuizQuestions();
  }

  function speakText(text) {
    if (!('speechSynthesis' in window)) {
      alert("您的瀏覽器不支援語音朗讀功能");
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }

  function renderQuizQuestions() {
    const container = document.getElementById("quiz-questions-container");
    container.innerHTML = "";
    if (activeQuestions.length === 0) {
      container.innerHTML = `<div class="liquid-card" style="padding:24px;text-align:center;">尚無測驗題目，請先點擊首頁「立即同步最新題庫」。</div>`;
      return;
    }

    let visibleCount = 0;
    activeQuestions.forEach((q, idx) => {
      const isVisible = (activeExamSubFilter === "all" || q.sub === activeExamSubFilter);
      if (!isVisible) return;
      visibleCount++;

      const card = document.createElement("div");
      card.className = "liquid-card q-card";
      card.id = `q-card-${idx}`;

      const diffCls = q.diff === "\u57FA\u790E" ? "diff-basic" : (q.diff === "\u6311\u6230" ? "diff-hard" : "diff-mid");
      const elimSet = eliminatedMap[idx] || {};
      const isCollapsed = !!collapsedPassageMap[idx];

      let listeningHtml = "";
      let passageHtml = "";

      if (q.type === "\u807D\u529B\u6E2C\u9593" || q.passage) {
        if (q.type === "\u807D\u529B\u6E2C\u9593" && q.passage) {
          listeningHtml = `
            <div class="listening-box">
              <div>
                <div style="font-weight:800;font-size:14px;color:#166534;">&#x1F50A; \u82F1\u6587\u807D\u529B\u6E2C\u9593\u95B1\u8B80</div>
                <div style="font-size:12px;color:#15803d;">\u807D\u529B\u7A3F\u5DF2\u81EA\u52D5\u96B1\u85CF\uff0c\u8ACB\u9EDE\u64CA\u6309\u9215\u6538\u807D\u6A19\u6E96\u7F8E\u97F3</div>
              </div>
              <button class="btn-primary" style="width:auto;padding:10px 16px;font-size:14px;" onclick="speakText(${JSON.stringify(q.passage)})">
                &#x1F50A; \u64AD\u653E\u807D\u529B\u6B0C\u97f3
              </button>
            </div>
          `;
          if (quizSubmitted) {
            passageHtml = `
              <div class="reading-passage-box" style="position:static;background:#f0fdf4;border-color:#bbf7d0;">
                <div class="reading-passage-header" style="color:#166534;">&#x1F4D6; \u807D\u529B\u7A3F\u539f\u6587\u5C0D\u7167</div>
                <div class="reading-passage-text">${q.passage}</div>
              </div>
            `;
          }
        } else if (q.passage) {
          passageHtml = `
            <div class="reading-passage-box">
              <div class="reading-passage-header">
                <span>&#x1F4D6; \u95B1\u8B80\u6587\u672C\uff08\u7F6E\u9802\u5C0D\u7167\u5340\uff09</span>
                <button class="btn-secondary" style="padding:3px 9px;font-size:11px;" onclick="togglePassageCollapse(${idx})">
                  ${isCollapsed ? "\u5C55\u958B\u5168\u6587" : "\u6536\u5408\u6587\u7AE0"}
                </button>
              </div>
              <div class="reading-passage-text ${isCollapsed ? "collapsed" : ""}">${q.passage}</div>
            </div>
          `;
        }
      }

      const optsHtml = q.opts.map((opt, oIdx) => {
        let cls = "option-btn";
        if (quizSubmitted) {
          if (oIdx === q.ans) cls += " correct";
          else if (userAnswers[idx] === oIdx) cls += " wrong";
        } else {
          if (userAnswers[idx] === oIdx) cls += " selected";
          if (elimSet[oIdx]) cls += " eliminated";
        }
        return `
          <div class="option-row">
            <button class="${cls}" onclick="selectOption(${idx}, ${oIdx})">${String.fromCharCode(65 + oIdx)}. ${opt}</button>
            ${!quizSubmitted ? `<button class="elim-btn ${elimSet[oIdx] ? "active" : ""}" title="\u6D88\u53BB\u6CD5\u5283\u6389" onclick="toggleEliminate(${idx}, ${oIdx})">&#x1F6AB;</button>` : ""}
          </div>
        `;
      }).join("");

      const chosenLabel = userAnswers[idx] !== undefined
        ? `${String.fromCharCode(65 + userAnswers[idx])}. ${q.opts[userAnswers[idx]]}`
        : "\u672A\u4F5C\u7B54";
      const correctLabel = `${String.fromCharCode(65 + q.ans)}. ${q.opts[q.ans]}`;

      const postCompareHtml = quizSubmitted ? `
        <div class="answer-compare-grid">
          <div class="${userAnswers[idx] === q.ans ? "compare-pill-correct" : "compare-pill-wrong"}">
            \u4F60\u7684\u4F5C\u7B54\uff1A${chosenLabel}
          </div>
          <div class="compare-pill-correct">
            \u6B63\u78BA\u7B54\u6848\uff1A${correctLabel}
          </div>
        </div>
        <div class="explain-box"><strong>\u767D\u8A71\u89E3\u6790\uff1A</strong>${q.exp}</div>
      ` : "";

      card.innerHTML = `
        <div class="q-header">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <strong style="font-size:15px;">\u7B2C ${idx + 1} \u984C</strong>
            <span class="badge">${q.sub}</span>
            <span class="badge ${diffCls}">${q.diff}</span>
            <span class="badge" style="background:#f1f5f9;color:#475569;">${q.type}</span>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="flag-btn ${flaggedMap[idx] ? "active" : ""}" onclick="toggleFlag(${idx})">&#x1F6A9; \u6A19\u8A18</button>
            <button class="btn-secondary" style="padding:5px 10px;font-size:12px;" onclick="showHint(${idx})">&#x1F4A1; \u63D0\u793A</button>
          </div>
        </div>
        ${listeningHtml}
        ${passageHtml}
        <div class="q-stem">${q.stem}</div>
        ${q.img ? `<div class="q-img-wrap"><img src="${q.img}" onclick="zoomImg('${q.img}')" /></div>` : ""}
        <div class="options-list">${optsHtml}</div>
        <div class="hint-box" id="hint-${idx}" data-level="0"></div>
        ${postCompareHtml}
      `;
      container.appendChild(card);
    });

    if (visibleCount === 0) {
      container.innerHTML = `<div class="liquid-card" style="padding:24px;text-align:center;color:var(--text-sub);">此科目目前沒有題目。</div>`;
    }
  }

  function selectOption(qIdx, oIdx) {
    if (quizSubmitted) return;
    userAnswers[qIdx] = oIdx;
    renderMiniGrid();
    renderQuizQuestions();
  }

  function toggleEliminate(qIdx, oIdx) {
    if (quizSubmitted) return;
    if (!eliminatedMap[qIdx]) eliminatedMap[qIdx] = {};
    eliminatedMap[qIdx][oIdx] = !eliminatedMap[qIdx][oIdx];
    renderQuizQuestions();
  }

  function toggleFlag(qIdx) {
    flaggedMap[qIdx] = !flaggedMap[qIdx];
    renderMiniGrid();
    renderQuizQuestions();
  }

  function showHint(idx) {
    const box = document.getElementById(`hint-${idx}`);
    const q = activeQuestions[idx];
    const lvl = parseInt(box.getAttribute("data-level") || "0", 10);
    box.style.display = "block";
    if (lvl === 0) {
      box.innerHTML = `<strong>\u63D0\u793A 1\uFF08\u601D\u8DEF\u5F15\u5C0E\uFF09\uFF1A</strong>${q.h1}`;
      box.setAttribute("data-level", "1");
    } else {
      box.innerHTML = `<strong>\u63D0\u793A 1\uFF1A</strong>${q.h1}<br><strong>\u63D0\u793A 2\uFF08\u95DC\u9375\u6B65\u9A5F\uFF09\uFF1A</strong>${q.h2}`;
      box.setAttribute("data-level", "2");
    }
  }

  function submitQuiz() {
    const unanswered = activeQuestions.length - Object.keys(userAnswers).length;
    const msg = unanswered > 0
      ? `\u9084\u6709 ${unanswered} \u984C\u5C1A\u672A\u4F5C\u7B54\u5594\uFF01\u78BA\u5B9A\u8981\u73FE\u5728\u4EA4\u5377\u55CE\uFF1F`
      : "\u5DF2\u5B8C\u6210\u5168\u90E8 30 \u984C\u4F5C\u7B54\uFF0C\u78BA\u5B9A\u8981\u73FE\u5728\u4EA4\u5377\u6279\u6539\u55CE\uFF1F";
    if (!confirm(msg)) return;

    stopTimer();
    quizSubmitted = true;
    activeExamSubFilter = "all";
    updateExamSubFilterUI("all");

    let correctCount = 0;
    activeQuestions.forEach((q, idx) => {
      if (!state.solvedIds.includes(q.id)) state.solvedIds.push(q.id);
      if (userAnswers[idx] === q.ans) {
        correctCount++;
      } else {
        const wrongEntry = Object.assign({}, q, {
          chosenText: userAnswers[idx] !== undefined ? q.opts[userAnswers[idx]] : "\u672A\u8A18\u9304"
        });
        if (!state.wrongBook.some(w => w.id === q.id)) {
          state.wrongBook.unshift(wrongEntry);
        }
      }
    });

    const score = Math.round((correctCount / activeQuestions.length) * 100);
    if (score >= 80 && !state.completedWeeks.includes(state.currentWeek)) {
      state.completedWeeks.push(state.currentWeek);
      if (state.currentWeek < 15) state.currentWeek += 1;
    }

    saveState();
    renderAll();
    renderQuizQuestions();

    document.getElementById("quiz-submit-area").classList.add("hidden");
    const banner = document.getElementById("quiz-result-banner");
    banner.classList.remove("hidden");
    document.getElementById("result-score-text").textContent = `\u672C\u6B21\u5F97\u5206\uFF1A${score} \u5206\uff08\u7B54\u5C0D ${correctCount} / 30 \u984C\uff09`;
    document.getElementById("result-feedback-text").textContent = score >= 80
      ? "\u592A\u68D2\u4E86\uFF01\u9054\u6210 80 \u5206\u901A\u95DC\u6A19\u6E96\uFF0C\u5DF2\u81EA\u52D5\u89E3\u9396\u4E26\u63A8\u9032\u9032\u5EA6\u3002"
      : "\u5C1A\u672A\u9054 80 \u5206\u901A\u95DC\u9580\u6ABB\uFF0C\u5EFA\u8B70\u5148\u5230\u300C\u6B65\u9A5F\u4E09\uFF1A\u932F\u984C\u672C\u300D\u641E\u61C2\u89E3\u6790\uFF0C\u518D\u63DB\u65B0\u984C\u6311\u6230\u4E00\u6B21\uFF01";
    banner.scrollIntoView({ behavior: "smooth" });
  }

  function renderWrongBook() {
    const box = document.getElementById("wrong-book-container");
    if (state.wrongBook.length === 0) {
      box.innerHTML = `<div class="liquid-card" style="padding:36px 20px;text-align:center;color:var(--text-sub);">
        <div style="font-size:36px;margin-bottom:8px;">&#x1F389;</div>
        <div style="font-weight:700;font-size:16px;">\u76EE\u524D\u6C92\u6709\u5F85\u8907\u7FD2\u7684\u932F\u984C\uff01</div>
        <div style="font-size:13px;margin-top:4px;">\u7E7C\u7E8C\u4FDD\u6301\uFF0C\u524D\u5F80\u6B65\u9A5F\u4E8C\u6311\u6230\u66F4\u591A\u65B0\u984C\u5427\u3002</div>
      </div>`;
      return;
    }
    box.innerHTML = state.wrongBook.map((q, idx) => `
      <div class="liquid-card q-card">
        <div class="q-header">
          <span class="badge">${q.sub} &middot; ${q.type}</span>
          <button class="btn-secondary" style="padding:6px 12px;font-size:12px;color:#059669;border-color:#10b981;" onclick="markMastered(${idx})">&#x2705; \u6211\u5DF2\u5B8C\u6210\u641E\u61C2\uff08\u79FB\u9664\uff09</button>
        </div>
        ${q.passage ? `<div class="reading-passage-box" style="position:static;"><div class="reading-passage-text">${q.passage}</div></div>` : ""}
        <div class="q-stem">${q.stem}</div>
        ${q.img ? `<div class="q-img-wrap"><img src="${q.img}" onclick="zoomImg('${q.img}')" /></div>` : ""}
        <div class="answer-compare-grid">
          <div class="compare-pill-wrong">\u4F60\u7684\u4F5C\u7B54\uff1A${q.chosenText || "\u672A\u8A18\u9304"}</div>
          <div class="compare-pill-correct">\u6B63\u78BA\u7B54\u6848\uff1A${q.opts[q.ans]}</div>
        </div>
        <div class="explain-box"><strong>\u767D\u8A71\u89E3\u6790\uff1A</strong>${q.exp}</div>
      </div>
    `).join("");
  }

  function markMastered(idx) {
    state.wrongBook.splice(idx, 1);
    saveState();
    renderAll();
  }

  function handleSafeReset() {
    const btn = document.getElementById("reset-progress-btn");
    if (resetConfirmStep === 0) {
      resetConfirmStep = 1;
      btn.textContent = "\u26A0\uFE0F \u518D\u9EDE\u4E00\u6B21\u78BA\u8A8D\u6E05\u7A7A\u6240\u6709\u9032\u5EA6\u8207\u5DF2\u5237\u984C\u865F";
      btn.style.color = "var(--danger)";
      btn.style.borderColor = "var(--danger)";
      setTimeout(() => {
        resetConfirmStep = 0;
        btn.textContent = "\u91CD\u7F6E\u5237\u984C\u7D00\u9304\uff08\u8003\u524D\u7E3D\u91CD\u5237\u7528\uff09";
        btn.style.color = "var(--text-muted)";
        btn.style.borderColor = "";
      }, 4000);
    } else {
      state.currentWeek = 1;
      state.completedWeeks = [];
      state.solvedIds = [];
      state.wrongBook = [];
      saveState();
      resetConfirmStep = 0;
      buildExam30();
      renderAll();
      alert("\u5DF2\u6E05\u7A7A\u5237\u984C\u7D00\u9304\uff0c\u53EF\u91CD\u65B0\u958B\u59CB\u7E3D\u8907\u7FD2\uff01");
    }
  }

  let drawing = false;
  function openScratchpad() {
    const modal = document.getElementById("scratchpad-modal");
    modal.classList.remove("hidden");
    const canvas = document.getElementById("scratch-canvas");
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    const ctx = canvas.getContext("2d");
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#0f172a";

    const getPos = (e) => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    };

    canvas.onmousedown = canvas.ontouchstart = (e) => {
      e.preventDefault();
      drawing = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    };
    canvas.onmousemove = canvas.ontouchmove = (e) => {
      if (!drawing) return;
      e.preventDefault();
      const p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    };
    canvas.onmouseup = canvas.ontouchend = () => { drawing = false; };
  }

  function clearScratchpad() {
    const canvas = document.getElementById("scratch-canvas");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function closeScratchpad() {
    document.getElementById("scratchpad-modal").classList.add("hidden");
  }

  function zoomImg(src) {
    document.getElementById("lightbox-img").src = src;
    document.getElementById("img-lightbox").classList.remove("hidden");
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function startTimer() {
    if (timerRunning) return;
    timerRunning = true;
    document.getElementById("timer-toggle-btn").textContent = "\u66AB\u505C";
    timerInterval = setInterval(() => {
      if (timerSeconds > 0) {
        timerSeconds--;
        document.getElementById("quiz-timer").textContent = formatTime(timerSeconds);
      } else {
        stopTimer();
        alert("\u6E2C\u9A57\u6642\u9593\u5230\uff01");
      }
    }, 1000);
  }

  function stopTimer() {
    timerRunning = false;
    clearInterval(timerInterval);
    document.getElementById("timer-toggle-btn").textContent = "\u7E7C\u7E8C";
  }

  function toggleTimer() {
    if (timerRunning) stopTimer();
    else startTimer();
  }

  function resetTimer() {
    stopTimer();
    timerSeconds = 1800;
    document.getElementById("quiz-timer").textContent = formatTime(timerSeconds);
  }

  loadState();
  updatePortalSummary();
  syncCloudDLC(false);
