<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>&#x79C1;&#x4E2D;&#x885D;&#x523A;&#x6A21;&#x64EC;&#x7AD9;</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f4f7fb 0%, #e9f0f8 50%, #f7f9fc 100%);
      --glass-bg: rgba(255, 255, 255, 0.86);
      --glass-border: rgba(255, 255, 255, 0.96);
      --glass-shadow: 0 12px 36px rgba(15, 23, 42, 0.06);
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --primary-soft: rgba(15, 118, 110, 0.1);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.1);
      --purple: #7c3aed;
      --purple-soft: rgba(124, 58, 237, 0.1);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.1);
      --warning: #d97706;
      --warning-soft: rgba(217, 119, 6, 0.14);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.65;
    }

    .liquid-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: var(--radius-lg);
    }

    .container {
      max-width: 940px;
      margin: 0 auto;
      padding: 16px 14px 72px;
    }

    /* Portal Lobby */
    #portal-view {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .portal-box {
      width: 100%;
      max-width: 460px;
      padding: 36px 26px;
      text-align: center;
    }

    .portal-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 22px;
      background: linear-gradient(135deg, #0f766e 0%, #2563eb 100%);
      color: #ffffff;
      font-size: 32px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.25);
    }

    .portal-title {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 8px;
      letter-spacing: 0.5px;
    }

    .portal-sub {
      font-size: 14px;
      color: var(--text-sub);
      margin: 0 0 20px;
    }

    /* Source Selector Bar on Portal Lobby */
    .source-selector-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    .source-pill-btn {
      padding: 12px 8px;
      border-radius: var(--radius-sm);
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .source-pill-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
    }

    .portal-status-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(203, 213, 225, 0.65);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 22px;
      text-align: left;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      padding: 8px 0;
    }

    .status-row + .status-row {
      border-top: 1px dashed rgba(203, 213, 225, 0.75);
    }

    .status-label {
      color: var(--text-sub);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-value {
      font-weight: 700;
      text-align: right;
      font-size: 13px !important;
      white-space: normal !important;
      word-break: break-all;
      max-width: 62%;
    }

    .btn-primary {
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 118, 110, 0.25);
      transition: transform 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      padding: 10px 14px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:active {
      background: #f1f5f9;
    }

    /* Main Header & Stats */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      margin-bottom: 14px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mini-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, #0f766e, #2563eb);
      color: #fff;
      font-weight: 800;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      padding: 14px 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
    }

    /* 15 Weeks Strip */
    .week-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 14px;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .week-strip::-webkit-scrollbar {
      height: 6px;
    }

    .week-strip::-webkit-scrollbar-track {
      background: rgba(203, 213, 225, 0.25);
      border-radius: 10px;
    }

    .week-strip::-webkit-scrollbar-thumb {
      background: rgba(15, 118, 110, 0.4);
      border-radius: 10px;
    }

    .week-strip::-webkit-scrollbar-thumb:hover {
      background: rgba(15, 118, 110, 0.7);
    }

    .week-pill {
      flex: 0 0 auto;
      padding: 9px 13px;
      border-radius: 14px;
      border: 1px solid rgba(203, 213, 225, 0.75);
      background: rgba(255, 255, 255, 0.8);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 76px;
    }

    .week-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 6px 14px rgba(15, 118, 110, 0.25);
    }

    .week-pill.done {
      border-color: #10b981;
    }

    /* Step Tabs */
    .step-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .step-tab {
      padding: 13px 8px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(203, 213, 225, 0.75);
      background: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      text-align: center;
    }

    .step-tab.active {
      background: #ffffff;
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
    }

    /* Teaching Library (Step 1) */
    .sub-filter-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .sub-pill {
      padding: 11px 8px;
      border-radius: 12px;
      border: 1px solid rgba(203, 213, 225, 0.8);
      background: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      text-align: center;
    }

    .sub-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .lecture-item {
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid var(--primary);
    }

    .lecture-item.dlc {
      border-left-color: var(--purple);
      background: rgba(250, 245, 255, 0.92);
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .badge.dlc {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .badge.diff-basic { background: #dcfce7; color: #166534; }
    .badge.diff-mid { background: #dbeafe; color: #1e40af; }
    .badge.diff-hard { background: #fee2e2; color: #991b1b; }

    /* Sticky Exam HUD (Step 2) */
    .exam-hud {
      position: sticky;
      top: 8px;
      z-index: 40;
      padding: 12px 14px;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(203, 213, 225, 0.95);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border-radius: 18px;
    }

    .hud-top-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .timer-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 18px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 10px;
      background: var(--danger-soft);
      color: var(--danger);
    }

    /* Subject Priority Filter Bar inside Step 2 */
    .exam-sub-filter {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .exam-sub-pill {
      padding: 10px 6px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .exam-sub-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
    }

    @media (min-width: 680px) {
      .mini-grid {
        grid-template-columns: repeat(15, 1fr);
      }
    }

    .mini-cell {
      height: 28px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .mini-cell.answered {
      background: #10b981;
      color: #ffffff;
      border-color: #059669;
    }

    .mini-cell.flagged {
      border: 2px solid #f59e0b;
      box-shadow: 0 0 0 1px #f59e0b;
    }

    /* Question Cards & Child-Friendly Reading / Option Controls */
    .q-card {
      padding: 20px 18px;
      margin-bottom: 18px;
      scroll-margin-top: 195px;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .q-stem {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      white-space: pre-line;
      line-height: 1.8;
    }

    /* Sticky/Collapsible Reading Passage Box */
    .reading-passage-box {
      position: sticky;
      top: 176px;
      z-index: 20;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-left: 4px solid var(--accent);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
    }

    .reading-passage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .reading-passage-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.85;
      white-space: pre-line;
      max-height: 180px;
      overflow-y: auto;
    }

    .reading-passage-text.collapsed {
      max-height: 44px;
      overflow: hidden;
      opacity: 0.75;
    }

    .q-img-wrap {
      margin: 12px 0 16px;
      text-align: center;
    }

    .q-img-wrap img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      cursor: zoom-in;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .option-btn {
      flex: 1;
      min-height: 50px;
      text-align: left;
      padding: 13px 16px;
      border-radius: var(--radius-sm);
      border: 1.5px solid rgba(203, 213, 225, 0.9);
      background: rgba(255, 255, 255, 0.96);
      color: var(--text-main);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #1e3a8a;
    }

    .option-btn.eliminated {
      text-decoration: line-through;
      opacity: 0.45;
      background: #f1f5f9;
    }

    .option-btn.correct {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.16);
      color: #065f46;
      opacity: 1;
      text-decoration: none;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: #991b1b;
      opacity: 1;
      text-decoration: none;
    }

    .elim-btn {
      flex: 0 0 48px;
      border-radius: var(--radius-sm);
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .elim-btn.active {
      background: #fee2e2;
      color: var(--danger);
      border-color: #fca5a5;
    }

    .flag-btn {
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-sub);
    }

    .flag-btn.active {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #b45309;
    }

    /* Listening Audio Player Box */
    .listening-box {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border: 1.5px solid #86efac;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Post-Exam Answer Comparison Strip */
    .answer-compare-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    @media (min-width: 560px) {
      .answer-compare-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .compare-pill-wrong {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--danger-soft);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #991b1b;
      font-size: 13px;
      font-weight: 700;
    }

    .compare-pill-correct {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #065f46;
      font-size: 13px;
      font-weight: 700;
    }

    .hint-box {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--warning-soft);
      color: #92400e;
      font-size: 14px;
      display: none;
    }

    .explain-box {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      font-size: 14px;
      color: var(--text-sub);
    }

    /* Scratchpad Drawer & Lightbox Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .scratchpad-box {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    #scratch-canvas {
      width: 100%;
      height: 310px;
      border: 1.5px dashed #94a3b8;
      border-radius: 12px;
      background: #fffbeb;
      touch-action: none;
      cursor: crosshair;
      display: block;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- 1. Minimalist One-Click Portal Entry Lobby -->
  <div id="portal-view">
    <div class="liquid-card portal-box">
      <div class="portal-badge">&#x52DD;</div>
      <h1 class="portal-title">&#x79C1;&#x4E2D;&#x885D;&#x523A;&#x6A21;&#x64EC;&#x7AD9;</h1>
      <p class="portal-sub">&#x6DE1;&#x6C5F; &times; &#x8587;&#x95A3; 15&#x9031;&#x5165;&#x5B78;&#x8003;&#x5099;&#x8003;&#x7CFB;&#x7D71;&#xFF08;2026/11/16 &ndash; 2027/02/27&#xFF09;</p>

      <!-- Source Repository Selector (Network vs Zhixin) -->
      <div class="source-selector-box">
        <button class="source-pill-btn active" id="src-btn-web" onclick="switchQuestionSource('web')">&#x1F310; &#x7DB2;&#x8DB3;&#x79C1;&#x4E2D;&#x984C;&#x5Eab;</button>
        <button class="source-pill-btn" id="src-btn-zhixin" onclick="switchQuestionSource('zhixin')">&#x1F3EB; &#x77E5;&#x6B65;&#x52A0;&#x5F37;&#x73ED;</button>
      </div>

      <div class="portal-status-card">
        <div class="status-row">
          <span class="status-label">&#x76EE;&#x524D;&#x63A8;&#x9032;&#x9031;&#x6B21;</span>
          <span class="status-value" id="portal-week-label" style="color:var(--primary);">&#x7B2C; 1 &#x9031;</span>
        </div>
        <div class="status-row">
          <span class="status-label">&#x7D2F;&#x7A4D;&#x901A;&#x95DC;&#x9032;&#x5EA6;</span>
          <span class="status-value" id="portal-progress-label">0 / 15 &#x9031;</span>
        </div>
        <div class="status-row">
          <span class="status-label">&#x5F85;&#x8907;&#x7FD2;&#x932F;&#x984C;&#x6578;</span>
          <span class="status-value" id="portal-wrong-label" style="color:var(--danger);">0 &#x984C;</span>
        </div>
        <div class="status-row">
          <span class="status-label">&#x96F2;&#x7AEF;&#x984C;&#x5Eab;&#x540C;&#x6B65;&#x72C0;&#x614B;</span>
          <span class="status-value" id="dlc-status-label" style="color:var(--purple);">&#x540C;&#x6B65;&#x4E2D;...</span>
        </div>
      </div>

      <button class="btn-primary" onclick="enterStudyStation()">
        &#x1F680; &#x958B;&#x59CB;&#x4ECA;&#x65E5;&#x885D;&#x523A;&#x6A21;&#x64EC; &rarr;
      </button>

      <div style="margin-top:12px;">
        <button class="btn-secondary" style="width:100%;" onclick="syncCloudDLC(true)">
          &#x1F504; &#x7ACB;&#x5373;&#x540C;&#x6B65;&#x6700;&#x65B0;&#x984C;&#x5EAB;
        </button>
      </div>
    </div>
  </div>

  <!-- 2. Main Study Station -->
  <div id="app-view" class="container hidden">
    <div class="liquid-card top-bar">
      <div class="brand-group">
        <div class="brand-mini-icon">&#x52DD;</div>
        <div>
          <div style="font-weight:800;font-size:16px;">
            <span id="active-source-badge" class="badge dlc" style="font-size:12px;margin-right:6px;">網路私中題庫</span>
            <span id="app-title-text">&#x6DE1;&#x6C5F; &times; &#x8587;&#x95A3;&#x5165;&#x5B78;&#x8003;&#x5099;&#x8003;&#x7CFB;&#x7D71;</span>

  function loadState() {

      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) state = Object.assign(state, JSON.parse(saved));

  function makeContentId(sub, stem) {
    const clean = (sub + "_" + String(stem || "").replace(/\s+/g, "").slice(0, 24));
    let hash = 0;
    for (let i = 0; i < clean.length; i++) {
      hash = ((hash << 5) - hash) + clean.charCodeAt(i);
      hash |= 0;
    }
    return "ID_" + Math.abs(hash).toString(36);
  }

  function normalizeImageUrl(url) {
    if (!url) return "";
    const trimmed = url.trim();
    const m1 = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (m1 && m1[1]) return `https://lh3.googleusercontent.com/d/${m1[1]}`; const m2 = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/); if (m2 && m2[1] && trimmed.includes("drive.google.com")) { return `https://lh3.googleusercontent.com/d/${m2[1]}`;
    }
    return trimmed;
  }

  function parseCSV(text) {
    const rows = [];
    let row = [];
    let cur = "";
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const next = text[i + 1];
      if (inQuotes) {
        if (ch === '"' && next === '"') {
          cur += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = false;
        } else {
          cur += ch;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
        } else if (ch === ",") {
          row.push(cur.trim());
          cur = "";
        } else if (ch === "\r" && next === "\n") {
          row.push(cur.trim());
          rows.push(row);
          row = [];
          cur = "";
          i++;
        } else if (ch === "\n" || ch === "\r") {
          row.push(cur.trim());
          rows.push(row);
          row = [];
          cur = "";
        } else {
          cur += ch;
        }
      }
    }
    if (cur.length > 0 || row.length > 0) {
      row.push(cur.trim());
      rows.push(row);
    }
    return rows;
  }

  async function syncCloudDLC(manual = false) {
    const label = document.getElementById("dlc-status-label");
    if (label) label.textContent = "\u540C\u6B65\u4E2D...";
    const ts = Date.now();
    const lecUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("\u8B1B\u7FA9DLC")}&_t=${ts}`; const qUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("\u984C\u5EABDLC")}&_t=${ts}`;
    const zLecUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("\u77E5\u6B65\u8B1B\u7FA9DLC")}&_t=${ts}`; const zQUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("\u77E5\u6B65\u984C\u5EABDLC")}&_t=${ts}`;

    try {
      const [lecRes, qRes, zLecRes, zQRes] = await Promise.all([
        fetch(lecUrl), fetch(qUrl), fetch(zLecUrl).catch(() => null), fetch(zQUrl).catch(() => null)
      ]);
      if (!lecRes.ok || !qRes.ok) throw new Error("Fetch failed");
      const [lecCsv, qCsv] = await Promise.all([lecRes.text(), qRes.text()]);

      const parseLecs = (csvText) => {
        const rows = parseCSV(csvText).slice(1).filter(r => r.length >= 4 && r[0] && r[2]);
        return rows.map(r => ({
          sub: r[0],
          cat: r[1] || "\u96F2\u7AEF\u64F4\u5145\u7CBE\u83EF",
          title: r[2],
          body: r[3],
          img: normalizeImageUrl(r[4] || ""),
          isDLC: true
        }));
      };

      const parseQs = (csvText) => {
        const rows = parseCSV(csvText).slice(1).filter(r => r.length >= 10 && r[0] && r[3]);
        const ansMap = { A: 0, B: 1, C: 2, D: 3 };
        return rows.map(r => {
          const ansIdx = ansMap[(r[9] || "A").toUpperCase()] ?? 0;
          let rawStem = r[3];
          let passageText = "";
          if (rawStem.includes("||")) {
            const parts = rawStem.split("||");
            passageText = parts[0].trim();
            rawStem = parts[1].trim();
          }
          return {
            id: makeContentId(r[0], rawStem),
            sub: r[0],
            diff: r[1] || "\u9032\u968E",
            type: r[2] || "\u96F2\u7AEF\u7CBE\u9078",
            stem: rawStem,
            passage: passageText,
            img: normalizeImageUrl(r[4] || ""),
            opts: [r[5] || "", r[6] || "", r[7] || "", r[8] || ""],
            ans: ansIdx,
            h1: r[10] || "\u8ACB\u4ED4\u7D30\u6BD4\u5C0D\u984C\u5E79\u95DC\u9375\u689D\u4EF6\u3002",
            h2: r[11] || "\u6392\u9664\u660E\u986F\u932F\u8AA4\u9078\u9805\u5F8C\u518D\u5224\u65B7\u3002",
            exp: r[12] || "\u8ACB\u53C3\u8003\u6B63\u78BA\u7B54\u6848\u89E3\u6790\u3002",
            isDLC: true
          };
        });
      };

      state.dlcLectures = parseLecs(lecCsv);
      state.dlcQuestions = parseQs(qCsv);

      if (zLecRes && zLecRes.ok) {
        const zLecText = await zLecRes.text();
        state.zhixinLectures = parseLecs(zLecText);
      }
      if (zQRes && zQRes.ok) {
        const zQText = await zQRes.text();
        state.zhixinQuestions = parseQs(zQText);
      }

      const now = new Date();
      state.lastSyncTime = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
      saveState();

      if (manual) {
        alert(`\u540C\u6B65\u5B8C\u6210\uff01\u8F09\u5165\u7DB2\u8DB3\u984C\u5EAB ${state.dlcLectures.length} 講/${state.dlcQuestions.length} 題，知欣班 ${state.zhixinLectures.length} 講/${state.zhixinQuestions.length} 題。`);
      }
    } catch (err) {
      updatePortalSummary(true);
      if (manual) {
        alert("\u96F2\u7AEF\u8A66\u7B97\u8868\u540C\u6B65\u66AB\u6642\u7121\u6CD5\u9023\u7DDA\uff0c\u7CFB\u7D71\u5DF2\u81EA\u52D5\u555F\u7528\u7DE8\u865F\u4FDD\u5E95\u6A54\uff01");
      }
    }
  }

  function updatePortalSummary(offline = false) {
    document.getElementById("portal-week-label").textContent = `\u7B2C ${state.currentWeek} \u9031`; document.getElementById("portal-progress-label").textContent = `${
