<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>私中衝刺模擬站｜淡江 × 薇閣入學備考系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f4f7fb 0%, #e9f0f8 50%, #f7f9fc 100%);
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.96);
      --glass-shadow: 0 12px 36px rgba(15, 23, 42, 0.06);
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --primary-soft: rgba(15, 118, 110, 0.1);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.1);
      --purple: #7c3aed;
      --purple-soft: rgba(124, 58, 237, 0.1);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.1);
      --warning: #d97706;
      --warning-soft: rgba(217, 119, 6, 0.14);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.65;
    }

    .liquid-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: var(--radius-lg);
    }

    .container-main {
      max-width: 940px;
      margin: 0 auto;
      padding: 16px 14px 72px;
    }

    /* Portal Lobby */
    #portal-view {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .portal-box {
      width: 100%;
      max-width: 460px;
      padding: 36px 26px;
      text-align: center;
    }

    .portal-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 22px;
      background: linear-gradient(135deg, #0f766e 0%, #2563eb 100%);
      color: #ffffff;
      font-size: 32px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.25);
    }

    .portal-title {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 8px;
      letter-spacing: 0.5px;
    }

    .portal-sub {
      font-size: 14px;
      color: var(--text-sub);
      margin: 0 0 20px;
    }

    /* Source Selector Bar on Portal Lobby */
    .source-selector-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    .source-pill-btn {
      padding: 12px 8px;
      border-radius: var(--radius-sm);
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .source-pill-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
    }

    .portal-status-card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(203, 213, 225, 0.65);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 22px;
      text-align: left;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      padding: 8px 0;
    }

    .status-row + .status-row {
      border-top: 1px dashed rgba(203, 213, 225, 0.75);
    }

    .status-label {
      color: var(--text-sub);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-value {
      font-weight: 700;
      text-align: right;
      font-size: 13px;
      word-break: break-word;
      max-width: 65%;
    }

    .btn-primary {
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 118, 110, 0.25);
      transition: transform 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      padding: 10px 14px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:active {
      background: #f1f5f9;
    }

    /* Toast Message Box (replaces alert/confirm) */
    .toast-banner {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.3);
      max-width: 92vw;
      text-align: center;
      transition: opacity 0.2s ease;
    }

    /* Main Header & Stats */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      margin-bottom: 14px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mini-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, #0f766e, #2563eb);
      color: #fff;
      font-weight: 800;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      padding: 14px 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
    }

    /* 15 Weeks Strip */
    .week-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 14px;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .week-strip::-webkit-scrollbar {
      height: 6px;
    }

    .week-strip::-webkit-scrollbar-track {
      background: rgba(203, 213, 225, 0.25);
      border-radius: 10px;
    }

    .week-strip::-webkit-scrollbar-thumb {
      background: rgba(15, 118, 110, 0.4);
      border-radius: 10px;
    }

    .week-pill {
      flex: 0 0 auto;
      padding: 9px 13px;
      border-radius: 14px;
      border: 1px solid rgba(203, 213, 225, 0.75);
      background: rgba(255, 255, 255, 0.8);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 76px;
    }

    .week-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 6px 14px rgba(15, 118, 110, 0.25);
    }

    .week-pill.done {
      border-color: #10b981;
    }

    /* Step Tabs */
    .step-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .step-tab {
      padding: 13px 8px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(203, 213, 225, 0.75);
      background: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      text-align: center;
    }

    .step-tab.active {
      background: #ffffff;
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
    }

    /* Teaching Library (Step 1) */
    .sub-filter-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .sub-pill {
      padding: 11px 8px;
      border-radius: 12px;
      border: 1px solid rgba(203, 213, 225, 0.8);
      background: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      text-align: center;
    }

    .sub-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .lecture-item {
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid var(--primary);
    }

    .lecture-item.dlc {
      border-left-color: var(--purple);
      background: rgba(250, 245, 255, 0.92);
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .badge.dlc {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .badge.diff-basic { background: #dcfce7; color: #166534; }
    .badge.diff-mid { background: #dbeafe; color: #1e40af; }
    .badge.diff-hard { background: #fee2e2; color: #991b1b; }

    /* Sticky Exam HUD (Step 2) */
    .exam-hud {
      position: sticky;
      top: 8px;
      z-index: 40;
      padding: 12px 14px;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(203, 213, 225, 0.95);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border-radius: 18px;
    }

    .hud-top-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .timer-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 18px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 10px;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .exam-sub-filter {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .exam-sub-pill {
      padding: 10px 6px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .exam-sub-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
    }

    @media (min-width: 680px) {
      .mini-grid {
        grid-template-columns: repeat(15, 1fr);
      }
    }

    .mini-cell {
      height: 28px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .mini-cell.answered {
      background: #10b981;
      color: #ffffff;
      border-color: #059669;
    }

    .mini-cell.flagged {
      border: 2px solid #f59e0b;
      box-shadow: 0 0 0 1px #f59e0b;
    }

    /* Question Cards */
    .q-card {
      padding: 20px 18px;
      margin-bottom: 18px;
      scroll-margin-top: 195px;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .q-stem {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      white-space: pre-line;
      line-height: 1.8;
    }

    .reading-passage-box {
      position: sticky;
      top: 176px;
      z-index: 20;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-left: 4px solid var(--accent);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
    }

    .reading-passage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .reading-passage-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.85;
      white-space: pre-line;
      max-height: 180px;
      overflow-y: auto;
    }

    .reading-passage-text.collapsed {
      max-height: 44px;
      overflow: hidden;
      opacity: 0.75;
    }

    .q-img-wrap {
      margin: 12px 0 16px;
      text-align: center;
    }

    .q-img-wrap img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      cursor: zoom-in;
      display: inline-block;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .option-btn {
      flex: 1;
      min-height: 50px;
      text-align: left;
      padding: 13px 16px;
      border-radius: var(--radius-sm);
      border: 1.5px solid rgba(203, 213, 225, 0.9);
      background: rgba(255, 255, 255, 0.96);
      color: var(--text-main);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #1e3a8a;
    }

    .option-btn.eliminated {
      text-decoration: line-through;
      opacity: 0.45;
      background: #f1f5f9;
    }

    .option-btn.correct {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.16);
      color: #065f46;
      opacity: 1;
      text-decoration: none;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: #991b1b;
      opacity: 1;
      text-decoration: none;
    }

    .elim-btn {
      flex: 0 0 48px;
      border-radius: var(--radius-sm);
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .elim-btn.active {
      background: #fee2e2;
      color: var(--danger);
      border-color: #fca5a5;
    }

    .flag-btn {
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-sub);
    }

    .flag-btn.active {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #b45309;
    }

    .listening-box {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border: 1.5px solid #86efac;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .answer-compare-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    @media (min-width: 560px) {
      .answer-compare-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .compare-pill-wrong {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--danger-soft);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #991b1b;
      font-size: 13px;
      font-weight: 700;
    }

    .compare-pill-correct {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #065f46;
      font-size: 13px;
      font-weight: 700;
    }

    .hint-box {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--warning-soft);
      color: #92400e;
      font-size: 14px;
      display: none;
    }

    .explain-box {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      font-size: 14px;
      color: var(--text-sub);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .scratchpad-box {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    #scratch-canvas {
      width: 100%;
      height: 310px;
      border: 1.5px dashed #94a3b8;
      border-radius: 12px;
      background: #fffbeb;
      touch-action: none;
      cursor: crosshair;
      display: block;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Toast Notification Banner -->
  <div id="toast-banner" class="toast-banner hidden"></div>

  <!-- 1. Portal Entry Lobby -->
  <div id="portal-view">
    <div class="liquid-card portal-box">
      <div class="portal-badge">勝</div>
      <h1 class="portal-title">私中衝刺模擬站</h1>
      <p class="portal-sub">淡江 × 薇閣入學備考系統（2026/11/16 – 2027/02/27）</p>

      <!-- Dual-Track Source Selector -->
      <div class="source-selector-box">
        <button class="source-pill-btn active" id="src-btn-web" onclick="switchQuestionSource('web')">🌐 網路私中題庫</button>
        <button class="source-pill-btn" id="src-btn-zhixin" onclick="switchQuestionSource('zhixin')">🏫 知欣加強班</button>
      </div>

      <div class="portal-status-card">
        <div class="status-row">
          <span class="status-label">目前推進週次</span>
          <span class="status-value" id="portal-week-label" style="color:var(--primary);">第 1 週</span>
        </div>
        <div class="status-row">
          <span class="status-label">累積通關進度</span>
          <span class="status-value" id="portal-progress-label">0 / 15 週</span>
        </div>
        <div class="status-row">
          <span class="status-label">待複習錯題數</span>
          <span class="status-value" id="portal-wrong-label" style="color:var(--danger);">0 題</span>
        </div>
        <div class="status-row">
          <span class="status-label">雲端題庫同步狀態</span>
          <span class="status-value" id="dlc-status-label" style="color:var(--purple);">同步中...</span>
        </div>
      </div>

      <button class="btn-primary" onclick="enterStudyStation()">
        🚀 開始今日衝刺模擬 →
      </button>

      <div style="margin-top:12px;">
        <button class="btn-secondary" style="width:100%;" onclick="syncCloudDLC(true)">
          🔄 立即同步最新題庫
        </button>
      </div>
    </div>
  </div>

  <!-- 2. Main Study Station -->
  <div id="app-view" class="container-main hidden">
    <div class="liquid-card top-bar">
      <div class="brand-group">
        <div class="brand-mini-icon">勝</div>
        <div>
          <div style="font-weight:800;font-size:16px;">
            <span id="active-source-badge" class="badge dlc" style="font-size:12px;margin-right:6px;">網路私中題庫</span>
            <span id="app-title-text">淡江 × 薇閣入學備考系統</span>
          </div>
          <div id="week-date-range" style="font-size:12px;color:var(--text-sub);"></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-secondary" onclick="returnToPortal()">返回首頁</button>

  function makeContentId(sub, stem) {
    const clean = (sub + "_" + String(stem || "").replace(/\s+/g, "").slice(0, 24));
    let hash = 0;
    for (let i = 0; i < clean.length; i++) {
      hash = ((hash << 5) - hash) + clean.charCodeAt(i);
      hash |= 0;
    }
    return "ID_" + Math.abs(hash).toString(36);
  }

  function normalizeImageUrl(url) {
    if (!url) return "";
    const trimmed = url.trim();
    const m1 = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (m1 && m1[1]) return `https://lh3.googleusercontent.com/d/${m1[1]}`;
    const m2 = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m2 && m2[1] && trimmed.includes("drive.google.com")) {
      return `https://lh3.googleusercontent.com/d/${m2[1]}`;
    }
    return trimmed;
  }

  function parseCSV(text) {
    const rows = [];
    let row = [];
    let cur = "";
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const next = text[i + 1];
      if (inQuotes) {
        if (ch === '"' && next === '"') {
          cur += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = false;
        } else {
          cur += ch;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
        } else if (ch === ",") {
          row.push(cur.trim());
          cur = "";
        } else if (ch === "\r" && next === "\n") {
          row.push(cur.trim());
          rows.push(row);
          row = [];
          cur = "";
          i++;
        } else if (ch === "\n" || ch === "\r") {
          row.push(cur.trim());
          rows.push(row);
          row = [];
          cur = "";
        } else {
          cur += ch;
        }
      }
    }
    if (cur.length > 0 || row.length > 0) {
      row.push(cur.trim());
      rows.push(row);
    }
    return rows;
  }

      };

      const parsedLecs = parseLecs(lecCsv);
      const parsedQs = parseQs(qCsv);

      if (parsedLecs.length === 0 && parsedQs.length === 0) {
        throw new Error("Empty sheet response");
      }

      state.dlcLectures = parsedLecs;
      state.dlcQuestions = parsedQs;

      if (zLecRes && zLecRes.ok) {
        const zLecText = await zLecRes.text();
        state.zhixinLectures = parseLecs(zLecText);
      }
      if (zQRes && zQRes.ok) {
        const zQText = await zQRes.text();
        state.zhixinQuestions = parseQs(zQText);
      }

      const now = new Date();
      state.lastSyncTime = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
      saveState();

      if (manual) {
        showToast(`同步完成！網路題庫 ${state.dlcLectures.length} 講/${state.dlcQuestions.length} 題，知欣班 ${state.zhixinLectures.length} 講/${state.zhixinQuestions.length} 題。`, 4500);
      }
    } catch (err) {
      // Load built-in fallback data if network/CORS is blocked in preview sandbox
      if (state.dlcLectures.length === 0) state.dlcLectures = FALLBACK_DATA.dlcLectures;
      if (state.dlcQuestions.length === 0) state.dlcQuestions = FALLBACK_DATA.dlcQuestions;
      if (state.zhixinLectures.length === 0) state.zhixinLectures = FALLBACK_DATA.zhixinLectures;
      if (state.zhixinQuestions.length === 0) state.zhixinQuestions = FALLBACK_DATA.zhixinQuestions;
      saveState();
      if (manual) {
        showToast("已載入內建精選預覽題庫（部署至 GitHub Pages 後將自動連線雲端試算表）。", 4000);
      }
    }
  }

  function shuffleArray(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function pickTenForSubject(subName) {
    const sourcePool = currentSource === "web" ? state.dlcQuestions : state.zhixinQuestions;
    const pool = sourcePool.filter(q => q.sub === subName);
    const effectivePool = pool.length > 0 ? pool : state.dlcQuestions.filter(q => q.sub === subName);

    const unseen = effectivePool.filter(q => !state.solvedIds.includes(q.id));
    const seen = effectivePool.filter(q => state.solvedIds.includes(q.id));
    const combined = [...shuffleArray(unseen), ...shuffleArray(seen)];
    const chosen = combined.slice(0, 10);
    return chosen.map(q => {
      const correctText = q.opts[q.ans];
      const shuffledOpts = shuffleArray(q.opts);
      return Object.assign({}, q, {
        opts: shuffledOpts,
        ans: shuffledOpts.indexOf(correctText)
      });
    });
  }

  function buildExam30() {
    const chi10 = pickTenForSubject("國文");

  function speakText(text) {
    if (!('speechSynthesis' in window)) {
      showToast("您的瀏覽器不支援語音朗讀功能");
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }

  function renderQuizQuestions() {
    const container = document.getElementById("quiz-questions-container");
    container.innerHTML = "";
    if (activeQuestions.length === 0) {
      container.innerHTML = `<div class="liquid-card" style="padding:24px;text-align:center;">尚無測驗題目，請先點擊首頁「立即同步最新題庫」。</div>`;
      return;
    }

    let visibleCount = 0;
    activeQuestions.forEach((q, idx) => {
      const isVisible = (activeExamSubFilter === "all" || q.sub === activeExamSubFilter);
      if (!isVisible) return;
      visibleCount++;

      const card = document.createElement("div");
      card.className = "liquid-card q-card";
      card.id = `q-card-${idx}`;

      const diffCls = q.diff === "基礎" ? "diff-basic" : (q.diff === "挑戰" ? "diff-hard" : "diff-mid");
      const elimSet = eliminatedMap[idx] || {};
      const isCollapsed = !!collapsedPassageMap[idx];

      let listeningHtml = "";
      let passageHtml = "";

      if (q.type === "聽力測驗" || q.passage) {
        if (q.type === "聽力測驗" && q.passage) {
          listeningHtml = `
            <div class="listening-box">
              <div>
                <div style="font-weight:800;font-size:14px;color:#166534;">🔊 英文聽力測驗閱讀</div>
                <div style="font-size:12px;color:#15803d;">聽力稿已自動隱藏，請點擊按鈕聆聽標準美音</div>
              </div>
              <button class="btn-primary" style="width:auto;padding:10px 16px;font-size:14px;" onclick="speakText(${JSON.stringify(q.passage)})">
                🔊 播放聽力語音
              </button>
            </div>
          `;
          if (quizSubmitted) {
            passageHtml = `
              <div class="reading-passage-box" style="position:static;background:#f0fdf4;border-color:#bbf7d0;">
                <div class="reading-passage-header" style="color:#166534;">📖 聽力稿原文對照</div>
                <div class="reading-passage-text">${q.passage}</div>
              </div>
            `;
          }
        } else if (q.passage) {
          passageHtml = `
            <div class="reading-passage-box">
              <div class="reading-passage-header">
                <span>📖 閱讀文本（置頂對照區）</span>
                <button class="btn-secondary" style="padding:3px 9px;font-size:11px;" onclick="togglePassageCollapse(${idx})">
                  ${isCollapsed ? "展開全文" : "收合文章"}
                </button>
              </div>
              <div class="reading-passage-text ${isCollapsed ? "collapsed" : ""}">${q.passage}</div>
            </div>
          `;
        }
      }

      const optsHtml = q.opts.map((opt, oIdx) => {
        let cls = "option-btn";
        if (quizSubmitted) {
          if (oIdx === q.ans) cls += " correct";
          else if (userAnswers[idx] === oIdx) cls += " wrong";
        } else {
          if (userAnswers[idx] === oIdx) cls += " selected";
          if (elimSet[oIdx]) cls += " eliminated";
        }
        return `
          <div class="option-row">
            <button class="${cls}" onclick="selectOption(${idx}, ${oIdx})">${String.fromCharCode(65 + oIdx)}. ${opt}</button>
            ${!quizSubmitted ? `<button class="elim-btn ${elimSet[oIdx] ? "active" : ""}" title="消去法劃掉" onclick="toggleEliminate(${idx}, ${oIdx})">🚫</button>` : ""}
          </div>
        `;
      }).join("");

      const chosenLabel = userAnswers[idx] !== undefined
        ? `${String.fromCharCode(65 + userAnswers[idx])}. ${q.opts[userAnswers[idx]]}`
        : "未作答";
      const correctLabel = `${String.fromCharCode(65 + q.ans)}. ${q.opts[q.ans]}`;

      const postCompareHtml = quizSubmitted ? `
        <div class="answer-compare-grid">
          <div class="${userAnswers[idx] === q.ans ? "compare-pill-correct" : "compare-pill-wrong"}">
            你的作答：${chosenLabel}
          </div>
          <div class="compare-pill-correct">
            正確答案：${correctLabel}
          </div>
        </div>
        <div class="explain-box"><strong>白話解析：</strong>${q.exp}</div>
      ` : "";

      card.innerHTML = `
        <div class="q-header">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <strong style="font-size:15px;">第 ${idx + 1} 題</strong>

            <span class="badge ${diffCls}">${q.diff}</span>
            <span class="badge" style="background:#f1f5f9;color:#475569;">${q.type}</span>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="flag-btn ${flaggedMap[idx] ? "active" : ""}" onclick="toggleFlag(${idx})">🚩 標記</button>
            <button class="btn-secondary" style="padding:5px 10px;font-size:12px;" onclick="showHint(${idx})">💡 提示</button>
          </div>
        </div>
        ${listeningHtml}
        ${passageHtml}
        <div class="q-stem">${q.stem}</div>
        ${q.img ? `<div class="q-img-wrap"><img src="${q.img}" onerror="this.style.display='none'" onclick="zoomImg('${q.img}')" /></div>` : ""}

    });

      container.innerHTML = `<div class="liquid-card" style="padding:24px;text-align:center;color:var(--text-sub);">此科目目前沒有題目。</div>`;
    }
  }

  function selectOption(qIdx, oIdx) {
    if (quizSubmitted) return;
    userAnswers[qIdx] = oIdx;

  function toggleEliminate(qIdx, oIdx) {
    if (quizSubmitted) return;
    if (!eliminatedMap[qIdx]) eliminatedMap[qIdx] = {};
    eliminatedMap[qIdx][oIdx] = !eliminatedMap[qIdx][oIdx];
    renderQuizQuestions();

  function toggleFlag(qIdx) {

  function showHint(idx) {
    const box = document.getElementById(`hint-${idx}`);
    const q = activeQuestions[idx];
    const lvl = parseInt(box.getAttribute("data-level") || "0", 10);
    box.style.display = "block";
    if (lvl === 0) {
      box.innerHTML = `<strong>提示 1（思路引導）：</strong>${q.h1}`;
      box.setAttribute("data-level", "1");
    } else {
      box.innerHTML = `<strong>提示 1：</strong>${q.h1}<br><strong>提示 2（關鍵步驟）：</strong>${q.h2}`;
      box.setAttribute("data-level", "2");

  // Two-step non-blocking submit confirmation (no confirm() dialog)
  function handleQuizSubmitClick() {
    if (quizSubmitted) return;
    const unanswered = activeQuestions.length - Object.keys(userAnswers).length;
    if (unanswered > 0 && !submitConfirmPending) {
      submitConfirmPending = true;
      showToast(`還有 ${unanswered} 題尚未作答！請再點擊一次「交卷批改」確認直接交卷。`, 4000);
      setTimeout(() => { submitConfirmPending = false; }, 4500);
      return;
    }
    executeSubmitQuiz();
  }

  function executeSubmitQuiz() {
    stopTimer();
    quizSubmitted = true;
    submitConfirmPending = false;
    activeExamSubFilter = "all";
    updateExamSubFilterUI("all");

    let correctCount = 0;
    activeQuestions.forEach((q, idx) => {
      if (!state.solvedIds.includes(q.id)) state.solvedIds.push(q.id);
      if (userAnswers[idx] === q.ans) {
        correctCount++;
      } else {
        const wrongEntry = Object.assign({}, q, {
          chosenText: userAnswers[idx] !== undefined ? q.opts[userAnswers[idx]] : "未作答"
        });
        if (!state.wrongBook.some(w => w.id === q.id)) {
          state.wrongBook.unshift(wrongEntry);
        }
      }
    });

    const totalQ = activeQuestions.length || 1;
    const score = Math.round((correctCount / totalQ) * 100);
    if (score >= 80 && !state.completedWeeks.includes(state.currentWeek)) {
      state.completedWeeks.push(state.currentWeek);
      if (state.currentWeek < 15) state.currentWeek += 1;
    }

    saveState();
    renderAll();
    renderQuizQuestions();

    document.getElementById("quiz-submit-area").classList.add("hidden");
    const banner = document.getElementById("quiz-result-banner");
    banner.classList.remove("hidden");
    document.getElementById("result-score-text").textContent = `本次得分：${score} 分（答對 ${correctCount} / ${totalQ} 題）`;
    document.getElementById("result-feedback-text").textContent = score >= 80
      ? "太棒了！達成 80 分通關標準，已自動解鎖並推進進度。"
      : "尚未達 80 分通關門檻，建議先到「步驟三：錯題本」搞懂解析，再換新題挑戰一次！";
    banner.scrollIntoView({ behavior: "smooth" });
  }

    box.innerHTML = state.wrongBook.map((q, idx) => `

        <div class="q-header">
          <span class="badge">${q.sub} · ${q.type}</span>
          <button class="btn-secondary" style="padding:6px 12px;font-size:12px;color:#059669;border-color:#10b981;" onclick="markMastered(${idx})">✅ 我已完全搞懂（移除）</button>
        </div>
        ${q.passage ? `<div class="reading-passage-box" style="position:static;"><div class="reading-passage-text">${q.passage}</div></div>` : ""}
        <div class="q-stem">${q.stem}</div>
        ${q.img ? `<div class="q-img-wrap"><img src="${q.img}" onerror="this.style.display='none'" onclick="zoomImg('${q.img}')" /></div>` : ""}
        <div class="answer-compare-grid">
          <div class="compare-pill-wrong">你的作答：${q.chosenText || "未記錄"}</div>
          <div class="compare-pill-correct">正確答案：${q.opts[q.ans]}</div>
        </div>
        <div class="explain-box"><strong>白話解析：</strong>${q.exp}</div>
      </div>
    `).join("");
  }

  function markMastered(idx) {
    state.wrongBook.splice(idx, 1);
    saveState();
    renderAll();
    showToast("已從錯題本移除！");
  }

  function handleSafeReset() {
    const btn = document.getElementById("reset-progress-btn");
    if (resetConfirmStep === 0) {
      resetConfirmStep = 1;
      btn.textContent = "⚠️ 再點一次確認清空所有進度與已刷題號";
      btn.style.color = "var(--danger)";
      btn.style.borderColor = "var(--danger)";
      setTimeout(() => {
        resetConfirmStep = 0;
        btn.textContent = "重置刷題紀錄（考前總重刷用）";
        btn.style.color = "var(--text-muted)";
        btn.style.borderColor = "";
      }, 4000);
    } else {
      state.currentWeek = 1;
      state.completedWeeks = [];
      state.solvedIds = [];
      state.wrongBook = [];
      saveState();
      resetConfirmStep = 0;
      btn.textContent = "重置刷題紀錄（考前總重刷用）";
      btn.style.color = "var(--text-muted)";
      btn.style.borderColor = "";
      buildExam30();
      renderAll();
      showToast("已清空刷題紀錄，可重新開始總複習！");
    }
  }

  let drawing = false;
  function openScratchpad() {
    const modal = document.getElementById("scratchpad-modal");
    modal.classList.remove("hidden");
    const canvas = document.getElementById("scratch-canvas");
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width || 560;
    canvas.height = rect.height || 310;
    const ctx = canvas.getContext("2d");
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#0f172a";

    const getPos = (e) => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    };

    canvas.onmousedown = canvas.ontouchstart = (e) => {
      e.preventDefault();
      drawing = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    };
    canvas.onmousemove = canvas.ontouchmove = (e) => {
      if (!drawing) return;
      e.preventDefault();
      const p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    };
    canvas.onmouseup = canvas.ontouchend = () => { drawing = false; };
  }

  function clearScratchpad() {
    const canvas = document.getElementById("scratch-canvas");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function closeScratchpad() {
    document.getElementById("scratchpad-modal").classList.add("hidden");
  }

  function zoomImg(src) {
    document.getElementById("lightbox-img").src = src;
    document.getElementById("img-lightbox").classList.remove("hidden");
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function startTimer() {
    if (timerRunning) return;
    timerRunning = true;
    document.getElementById("timer-toggle-btn").textContent = "暫停";
    timerInterval = setInterval(() => {
      if (timerSeconds > 0) {
        timerSeconds--;
        document.getElementById("quiz-timer").textContent = formatTime(timerSeconds);
      } else {
        stopTimer();
        showToast("測驗時間到！系統已自動為您交卷批改。", 4000);
        executeSubmitQuiz();
      }
    }, 1000);
  }

  function stopTimer() {
    timerRunning = false;
    clearInterval(timerInterval);
    document.getElementById("timer-toggle-btn").textContent = "繼續";
  }

  function toggleTimer() {
    if (timerRunning) stopTimer();
    else startTimer();
  }

  function resetTimer() {
    stopTimer();
    timerSeconds = 1800;
    document.getElementById("quiz-timer").textContent = formatTime(timerSeconds);
  }

  window.onload = function () {
    loadState();
    updatePortalSummary();
    syncCloudDLC(false);
  };
</script>
</body>
</html>
